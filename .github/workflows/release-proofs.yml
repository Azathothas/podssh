name: release proofs

# The proofs of a published release, checked as its notes tell a user to
# check them, on a fresh runner (T-210, T-211; the first checks of T-251
# after a tag): SHA256SUMS against each binary; the provenance of each binary
# (gh attestation verify, through the API and with the release's bundle)
# names release.yml at the tag and the tag's commit; the signature of
# SHA256SUMS names release.yml at the tag (cosign 3, and 2.6, as the notes
# say both check it); and the x86_64 binary runs the short form of the
# release check, its --version naming the same commit; and podssh update
# (T-375): the x86_64 binary replaces itself with its release's, and the
# binary of the release before updates to it. Each proof must refuse a
# changed copy. It reads the release and publishes nothing.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "The published tag to check, as v1.0.0-beta.2"
        required: true

permissions:
  contents: read

jobs:
  proofs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: the tag and its commit
        run: |
          set -eu
          case "$TAG" in
            v[0-9]*) ;;
            *) echo "not the tag of a release: $TAG"; exit 1 ;;
          esac
          commit=$(timeout 60 gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)
          case "$commit" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*) ;;
            *) echo "no commit for $TAG: '$commit'"; exit 1 ;;
          esac
          echo "COMMIT=$commit" >> "$GITHUB_ENV"
          echo "the tag $TAG is at $commit"
      # The scripts of the tag, so that the short form checks the tag's own
      # version.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - name: the published files
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/release"
          cd "$RUNNER_TEMP/release"
          timeout 300 gh release download "$TAG" --repo "$GITHUB_REPOSITORY"
          ls -la
      - name: SHA256SUMS against each binary
        working-directory: ${{ runner.temp }}/release
        run: |
          set -eu
          n=0
          for f in podssh-*; do
            grep -q "  $f\$" SHA256SUMS || { echo "SHA256SUMS has no line for $f"; exit 1; }
            n=$((n + 1))
          done
          lines=$(wc -l < SHA256SUMS)
          test "$n" -eq "$lines" || { echo "SHA256SUMS has $lines lines, for $n binaries"; exit 1; }
          sha256sum -c SHA256SUMS
          echo "ok   SHA256SUMS: each of the $n binaries"
      - name: the provenance of each binary
        working-directory: ${{ runner.temp }}/release
        run: |
          set -eu
          signer="$GITHUB_REPOSITORY/.github/workflows/release.yml"
          verify() {
            timeout 120 gh attestation verify "$1" --repo "$GITHUB_REPOSITORY" --signer-workflow "$signer" \
              --source-ref "refs/tags/$TAG" --source-digest "$COMMIT" --deny-self-hosted-runners "${@:2}" > /dev/null
          }
          for f in podssh-*; do
            verify "$f"
            verify "$f" --bundle provenance.sigstore.json
            echo "ok   $f: $signer at refs/tags/$TAG, $COMMIT, through the API and with the bundle"
          done
          cp podssh-x86_64-unknown-linux-musl "$RUNNER_TEMP/changed"
          printf x >> "$RUNNER_TEMP/changed"
          if verify "$RUNNER_TEMP/changed" 2> /dev/null; then echo "a changed copy verified"; exit 1; fi
          if verify "$RUNNER_TEMP/changed" --bundle provenance.sigstore.json 2> /dev/null; then
            echo "a changed copy verified with the bundle"
            exit 1
          fi
          echo "ok   a changed copy fails, through the API and with the bundle"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
          install-dir: ${{ runner.temp }}/cosign2
      - name: the signature of SHA256SUMS
        working-directory: ${{ runner.temp }}/release
        run: |
          set -eu
          issuer=https://token.actions.githubusercontent.com
          workflow="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml"
          check() {
            "$1" verify-blob --bundle SHA256SUMS.sigstore.json --certificate-identity "$2" \
              --certificate-oidc-issuer "$issuer" "$3"
          }
          check cosign "$workflow@refs/tags/$TAG" SHA256SUMS
          check "$RUNNER_TEMP/cosign2/cosign" "$workflow@refs/tags/$TAG" SHA256SUMS
          # T-211's Prove: the release workflow at any tag of a release.
          cosign verify-blob --bundle SHA256SUMS.sigstore.json \
            --certificate-identity-regexp "^https://github.com/$GITHUB_REPOSITORY/\.github/workflows/release\.yml@refs/tags/v" \
            --certificate-oidc-issuer "$issuer" SHA256SUMS
          awk 'NR == 1 { $0 = (substr($0, 1, 1) == "0" ? "1" : "0") substr($0, 2) } { print }' SHA256SUMS \
            > "$RUNNER_TEMP/changed-sums"
          if check cosign "$workflow@refs/tags/$TAG" "$RUNNER_TEMP/changed-sums" 2> /dev/null; then
            echo "a changed copy verified"
            exit 1
          fi
          if check cosign "$workflow@refs/heads/main" SHA256SUMS 2> /dev/null; then
            echo "a branch's identity verified"
            exit 1
          fi
          echo "ok   SHA256SUMS: signed by $workflow@refs/tags/$TAG (cosign 3.1.4 and 2.6.5); a changed copy and a branch's identity fail"
      # The published binary itself: its version and its commit, the manual,
      # keygen, and GitHub's SSH banner through the live relay.
      - name: the short form of the release check, on the published x86_64 binary
        run: |
          set -eu
          bin="$RUNNER_TEMP/release/podssh-x86_64-unknown-linux-musl"
          chmod +x "$bin"
          PODSSH_BUILD_COMMIT="$COMMIT" timeout 300 sh scripts/release-short.sh "$bin" --net
      # podssh update on the published release (T-375), as a user runs it:
      # the published binary checks its own release's signature with the
      # roots compiled into it, replaces itself with its download, which runs;
      # and the binary of the release before, when it has podssh update,
      # updates to this one. A binary from before T-375 has no podssh update,
      # and the step says so. A change of Sigstore's roots, or of cosign's
      # bundle, fails here.
      - name: podssh update to this release
        run: |
          set -eu
          dir="$RUNNER_TEMP/update"
          mkdir -p "$dir/before"
          cp "$RUNNER_TEMP/release/podssh-x86_64-unknown-linux-musl" "$dir/podssh"
          chmod 0755 "$dir/podssh"
          if ! "$dir/podssh" update --help > /dev/null 2>&1; then
            echo "skip $TAG's binary has no podssh update (T-375 came after it)"
            exit 0
          fi
          timeout 300 "$dir/podssh" update --check --version "$TAG"
          timeout 600 "$dir/podssh" update --version "$TAG"
          got=$("$dir/podssh" --version)
          test "$got" = "podssh ${TAG#v} ($COMMIT)" || { echo "after the update, the binary says: $got"; exit 1; }
          echo "ok   $TAG's binary replaced itself with its download, which runs: $got"
          tags=$(timeout 60 gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 20 --json tagName --jq '.[].tagName')
          newest="" before="" seen=no
          for t in $tags; do
            if [ -z "$newest" ]; then newest=$t; fi
            if [ "$seen" = yes ]; then before=$t; break; fi
            if [ "$t" = "$TAG" ]; then seen=yes; fi
          done
          if [ -z "$before" ]; then echo "skip no release before $TAG"; exit 0; fi
          timeout 300 gh release download "$before" --repo "$GITHUB_REPOSITORY" \
            --pattern podssh-x86_64-unknown-linux-musl --dir "$dir/before"
          old="$dir/before/podssh-x86_64-unknown-linux-musl"
          chmod 0755 "$old"
          if ! "$old" update --help > /dev/null 2>&1; then
            echo "skip $before's binary has no podssh update: the update from it waits for a release that has"
            exit 0
          fi
          # The newest release by default, as a user's update finds it.
          if [ "$newest" = "$TAG" ]; then timeout 600 "$old" update; else timeout 600 "$old" update --version "$TAG"; fi
          got=$("$old" --version)
          test "$got" = "podssh ${TAG#v} ($COMMIT)" || { echo "$before's binary, updated, says: $got"; exit 1; }
          echo "ok   $before's binary updated to $TAG, which runs: $got"
