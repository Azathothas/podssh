name: publish

# The publish of podssh's crates to crates.io, apart from release.yml
# (docs/decisions.md, "The crates of PodUtils/podcrates"; T-686). crates.io
# trusts this file name in the environment crates-io, which only a tag v*
# can deploy to (trusted publishing): no token is stored, and the job gets
# a token for 30 minutes.
#
# * dry-run: the crates that the workspace lets out (no `publish = false`)
#   are packed and built, `cargo publish --workspace --dry-run`. It reads
#   the switch `crates-io` of [workspace.metadata.podssh] in Cargo.toml.
# * publish: only on a tag vX.Y.Z of the workspace version, with the switch
#   true at the tag and the gate (build.yml) green at its commit. The switch
#   stays false until the owner rules that podssh publishes (T-687).
#
# A tag that a person pushes starts it. release.yml pushes its tag with
# GITHUB_TOKEN, which starts no workflow, so it dispatches this file on the
# tag:  gh workflow run publish.yml --ref vX.Y.Z

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: never

jobs:
  dry-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.switch.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The switch and the conditions of a publish
        id: switch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          on=$(python3 -I -c 'import tomllib
          doc = tomllib.load(open("Cargo.toml", "rb"))
          print(str(doc["workspace"]["metadata"]["podssh"]["crates-io"]).lower())')
          publish=false
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            have=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
            [ "$GITHUB_REF_NAME" = "v$have" ] || { echo "the tag $GITHUB_REF_NAME is not v$have"; exit 1; }
            if [ "$on" = true ]; then
              sha=$(git rev-parse HEAD)
              state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$sha" \
                --jq '[.workflow_runs[] | select(.status == "completed")][0].conclusion // "none"')
              echo "build at $sha: $state"
              [ "$state" = success ] || { echo "the gate is not green at $sha"; exit 1; }
              publish=true
            fi
          fi
          echo "the switch crates-io: $on; the ref: $GITHUB_REF_TYPE $GITHUB_REF_NAME; publish: $publish"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
      - name: Toolchain
        run: |
          set -eu
          for try in 1 2 3; do
            if rustup toolchain install stable --profile minimal; then exit 0; fi
            echo "rustup failed (try $try of 3); again in $((try * 10)) s"; sleep $((try * 10))
          done
          exit 1
      # The crates that the workspace lets out: none while each one says
      # `publish = false`, and then there is nothing to pack.
      - name: Pack and build each crate
        run: |
          set -eu
          out=$(cargo metadata --locked --no-deps --format-version 1 | python3 -I -c 'import json, sys
          doc = json.load(sys.stdin)
          print(" ".join(p["name"] for p in doc["packages"] if p.get("publish") != []))')
          if [ -z "$out" ]; then
            echo "no crate of the workspace is let out (each says publish = false): nothing to pack"
            exit 0
          fi
          echo "the crates to pack: $out"
          cargo publish --workspace --locked --dry-run

  publish:
    needs: dry-run
    if: needs.dry-run.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      # The dry run built each package of this commit: no second build, so
      # that the publish ends inside the 30 minutes of the token.
      - name: Publish
        run: cargo publish --workspace --locked --no-verify
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
