name: forwarder live

# The public forwarders of other products that the binary names (T-370),
# live from GitHub's network, by the operator's ruling Q56: from GitHub
# Actions only, and short: one connection to each, one at a time, and the
# first line of github.com port 22 through it, GitHub's version line. Each
# day, as the watch of their life, since they publish no limit and give no
# notice; and by hand. A planted run names a host under .invalid for each,
# and must fail. No relay token goes to a forwarder; nothing is published.
# The Wisp demo server is the fourth, by the operator's ruling Q65 (T-438);
# before the live run, the Wisp client meets wisp-server-python, Mercury
# Workshop's own server, on the runner's loopback, which the gate's image
# does not carry.

on:
  schedule:
    # Each day at 04:17 UTC, off the hour.
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forwarder-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build the test
        run: cargo test --locked -p podssh-ws --test live_forwarder --test wisp --no-run
      # Pinned, in a venv of its own: the release whose source was read, and
      # the websockets whose legacy server it uses.
      - name: wisp-server-python, the reference server of Wisp
        run: |
          python3 -m venv "$RUNNER_TEMP/wisp-venv"
          "$RUNNER_TEMP/wisp-venv/bin/pip" install --quiet wisp-python==0.9.0 websockets==15.0.1
      - name: the Wisp client against the reference server, on the loopback
        env:
          PODSSH_TEST_WISP_REQUIRED: "1"
        run: |
          export PODSSH_TEST_WISP_PYTHON="$RUNNER_TEMP/wisp-venv/bin/python"
          timeout 600 cargo test --locked -p podssh-ws --test wisp -- --nocapture
      - name: GitHub's version line through each forwarder, the Wisp demo server last
        run: timeout 300 cargo test --locked -p podssh-ws --test live_forwarder -- --ignored --nocapture --test-threads=1
      # The check must see a forwarder that is gone: each planted host fails it.
      - name: a planted host fails it
        env:
          PODSSH_TEST_FORWARDER_PLANT: "1"
        run: |
          rc=0
          timeout 300 cargo test --locked -p podssh-ws --test live_forwarder -- --ignored --test-threads=1 || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "the check is vacuous: the planted hosts passed"
            exit 1
          fi
          echo "the planted hosts failed (exit $rc), as they must"
