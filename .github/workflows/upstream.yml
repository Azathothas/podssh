name: upstream

# Each week, and by hand: cloudflared's newest release against the pin of
# podssh's quick tunnel (scripts/check-upstream.py, T-339). podssh speaks
# cloudflared's protocol, which publishes no contract, and Cloudflare
# supports a cloudflared for a year after its newest release. The run is red
# when a file of the protocol moved, or the pin is 9 months old. It makes no
# tunnel. And the upstreams of the vendored crates (scripts/check-vendored.py,
# T-341): red when one released what no session read and judged. And the
# tools that no lock pins (scripts/check-release-tools.py, T-343): Zig's
# community mirrors against their copy, and check-jsonschema against its pin.

on:
  schedule:
    # Mondays at 06:37 UTC, off the hour.
    - cron: "37 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflared:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cloudflared's newest release against the pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-upstream.py
      # The check must see a file that moved: a planted sum fails it.
      - name: a planted sum fails it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          python3 scripts/check-upstream.py --plant-sum features/features.go || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "the check is vacuous: the planted sum exited $rc, not 1"
            exit 1
          fi
          echo "the planted sum exited 1, as it must"

  # crates.io's newest russh and iroh-relay, and tailscale-rs's latest
  # release, against the copies and the lines "Upstream read" of
  # vendor/README.md: Dependabot moves no path package.
  vendored:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the vendored crates' upstreams against vendor/README.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-vendored.py
      # The check must see a release that no session judged: a planted line
      # fails it.
      - name: a planted line fails it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          python3 scripts/check-vendored.py --plant-read first || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "the check is vacuous: the planted line exited $rc, not 1"
            exit 1
          fi
          echo "the planted line exited 1, as it must"

  # Zig's mirrors, which the riscv64 build reads, and check-jsonschema, which
  # the build's checks run, against their sources (T-343).
  release-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Zig's mirrors and check-jsonschema against their sources
        run: python3 scripts/check-release-tools.py
      # The check must see each change: a planted mirror and a planted pin
      # each fail it.
      - name: a planted mirror and a planted pin fail it
        run: |
          for plant in --plant-mirror --plant-pin; do
            rc=0
            python3 scripts/check-release-tools.py "$plant" || rc=$?
            if [ "$rc" -ne 1 ]; then
              echo "the check is vacuous: $plant exited $rc, not 1"
              exit 1
            fi
            echo "$plant exited 1, as it must"
          done
