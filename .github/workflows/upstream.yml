name: upstream

# Each week, and by hand: cloudflared's newest release against the pin of
# podssh's quick tunnel (scripts/check-upstream.py, T-339). podssh speaks
# cloudflared's protocol, which publishes no contract, and Cloudflare
# supports a cloudflared for a year after its newest release. The run is red
# when a file of the protocol moved, or the pin is 9 months old. It makes no
# tunnel. T-341 adds the upstreams of the vendored crates here.

on:
  schedule:
    # Mondays at 06:37 UTC, off the hour.
    - cron: "37 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cloudflared:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: cloudflared's newest release against the pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-upstream.py
      # The check must see a file that moved: a planted sum fails it.
      - name: a planted sum fails it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rc=0
          python3 scripts/check-upstream.py --plant-sum features/features.go || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "the check is vacuous: the planted sum exited $rc, not 1"
            exit 1
          fi
          echo "the planted sum exited 1, as it must"
