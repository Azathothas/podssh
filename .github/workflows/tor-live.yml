name: tor live

# T-353: the Tor road on Tor's public network, by the operator's leave
# (Q60, 2026-11-01): short runs, one bootstrap of Arti and one stream to
# github.com:22, twice. Started by hand only; it publishes nothing.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type Q60 to reach Tor's public network"
        required: true

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "4"
    steps:
      - name: the operator's leave
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: '[ "$CONFIRM" = Q60 ] || { echo "confirm must be Q60"; exit 1; }'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build with the feature tor
        run: cargo test --locked -p podssh-cli --features tor --test tor_live --no-run
      - name: GitHub's banner through Tor's public network
        run: timeout 900 cargo test --locked -p podssh-cli --features tor --test tor_live -- --ignored --nocapture
      # The Prove's case of a cage: each first hop through the box's proxy,
      # which takes ports 443, 80 and 8443 alone; podssh holds Arti's first
      # hops to 443 through a proxy (PODSSH_TOR_PORTS), and the stream to
      # github.com:22 leaves Tor at an exit, never through the proxy.
      - name: the same through the box's proxy of a cage's ports
        run: |
          python3 scripts/box/proxy.py --listen 127.0.0.1:3129 >"$RUNNER_TEMP/proxy.log" 2>&1 &
          echo $! >"$RUNNER_TEMP/proxy.pid"
          for _ in $(seq 1 20); do grep -q listening "$RUNNER_TEMP/proxy.log" && break; sleep 0.5; done
          rc=0
          HTTPS_PROXY=http://127.0.0.1:3129 timeout 900 cargo test --locked -p podssh-cli --features tor \
            --test tor_live -- --ignored --nocapture || rc=$?
          kill "$(cat "$RUNNER_TEMP/proxy.pid")" 2>/dev/null || true
          sed 's/^/proxy: /' "$RUNNER_TEMP/proxy.log" | head -40
          taken=$(grep -c '^200 CONNECT ' "$RUNNER_TEMP/proxy.log" || true)
          other=$(grep '^200 CONNECT ' "$RUNNER_TEMP/proxy.log" | grep -vc ':443 HTTP' || true)
          echo "first hops through the proxy: $taken, on another port than 443: $other"
          [ "$taken" -gt 0 ] || { echo "FAIL no first hop went through the proxy"; rc=1; }
          [ "$other" -eq 0 ] || { echo "FAIL a first hop on another port than 443"; rc=1; }
          ! grep -q 'github.com:22' "$RUNNER_TEMP/proxy.log" || { echo "FAIL the stream went through the proxy, not Tor"; rc=1; }
          exit "$rc"
