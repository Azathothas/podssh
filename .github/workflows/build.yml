name: build

# CI runs the same gate a developer runs (`sh scripts/dev.sh check` runs
# scripts/gate.sh in the same image). Nothing is re-implemented here: each
# step of the gate runs in a job of its own, at the same time. CI adds the
# repository checks, the plant of the no-C rule, the live relay check, the
# tests on Windows, and the upload of the static binary that the gate built.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The build image and the gate's steps, each read from the tree: the
  # matrix of the job `gate` is what `gate.sh --list` prints, so it cannot
  # drift from what `sh scripts/dev.sh check` runs.
  plan:
    name: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.image.outputs.image }}
      steps: ${{ steps.steps.outputs.steps }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The one place that names the build image, pinned to a digest.
      - name: the build image
        id: image
        run: |
          set -eu
          ref=$(tr -d '\r' < images/build/Dockerfile | sed -n 's/^FROM[[:space:]]\{1,\}\([^[:space:]]\{1,\}\).*/\1/p')
          case "$ref" in
            *@sha256:*) echo "image=$ref" >> "$GITHUB_OUTPUT" ;;
            *) echo "images/build/Dockerfile names no image pinned to a digest" >&2; exit 1 ;;
          esac

      # A list that is empty, or a name that the gate refuses, fails here
      # rather than as a matrix of no job, which would pass.
      - name: the gate's steps
        id: steps
        run: |
          set -eu
          list=$(sh scripts/gate.sh --list)
          [ -n "$list" ] || { echo "gate.sh --list printed no step" >&2; exit 1; }
          json=$(printf '%s\n' "$list" | jq -R . | jq -cs .)
          echo "steps=$json" >> "$GITHUB_OUTPUT"
          echo "the gate's steps: $json"

  gate:
    name: gate (${{ matrix.step }})
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        step: ${{ fromJSON(needs.plan.outputs.steps) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # gate.sh caps cargo jobs from the runner's available memory.
      - name: the gate, step ${{ matrix.step }}
        env:
          BUILD_IMAGE: ${{ needs.plan.outputs.image }}
          STEP: ${{ matrix.step }}
        # A mirror serves the same digest when Docker Hub refuses the pull.
        run: |
          image=$(sh scripts/pull-image.sh "$BUILD_IMAGE")
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e PODSSH_TARGET=x86_64-unknown-linux-musl \
            "$image" \
            sh scripts/gate.sh "$STEP"

      # The two forms of the check of the relay's facts, the binary's and the
      # script's, give one verdict on the pinned copy, a planted copy and the
      # live relay (T-060).
      - if: matrix.step == 'release'
        name: podssh relay spec and check-relay-spec.py agree
        run: python3 scripts/relay-spec-agree.py target/x86_64-unknown-linux-musl/release/podssh

      - if: matrix.step == 'release'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: podssh-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/podssh
          if-no-files-found: error

  # Proves the gate's no-C-compiler rule actually fires.
  plant:
    name: plant
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the no-C rule is load-bearing
        env:
          BUILD_IMAGE: ${{ needs.plan.outputs.image }}
        run: |
          image=$(sh scripts/pull-image.sh "$BUILD_IMAGE")
          docker run --rm \
            -v "$PWD:/work" -w /work \
            "$image" \
            sh scripts/plant.sh

  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The parent of the last commit, for the check of its citations.
          fetch-depth: 2

      # Resolve python by running it: a name that prints no version is not an
      # interpreter, and a check that did not run is not a pass.
      - name: resolve the interpreter
        run: |
          set -eu
          for cand in python3 python; do
            if command -v "$cand" >/dev/null 2>&1; then
              ver=$("$cand" -c 'import sys; print("%d.%d" % sys.version_info[:2])' 2>/dev/null || true)
              case "$ver" in
                3.*)
                  echo "PY=$cand" >> "$GITHUB_ENV"
                  echo "podssh: interpreter $cand ($ver)"
                  exit 0 ;;
              esac
            fi
          done
          echo "podssh: no working python 3 on PATH" >&2
          exit 1

      - name: repository checks
        run: '"$PY" scripts/check-repo.py'

      # The record's check compares the tree with HEAD, and a checkout has no
      # change, so a commit made without the check would leave citations of an
      # edited file that no later run sees. Compare the last commit with its
      # parent, as the check before the commit does (T-277). A checkout with
      # no parent fails: a check that did not run is not a pass.
      - name: the last commit left no citation unmoved
        run: |
          set -eu
          if ! git rev-parse -q --verify 'HEAD~1^{commit}' > /dev/null; then
            echo "the checkout has no parent of HEAD: the step needs fetch-depth 2" >&2
            exit 1
          fi
          cargo run --locked -q -p podssh-todo -- check --base HEAD~1

      # Each check must fail on an empty repository: a check that passes there
      # has lost its floor, and would pass a scan that read nothing.
      - name: each repository check fails on an empty tree
        run: |
          rc=0
          "$PY" scripts/check-repo.py --plant-empty || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "a check passed on an empty tree, or the plant did not run (exit $rc)"
            exit 1
          fi

      # Dependabot's configuration, against its published schema. A copy with
      # a wrong ecosystem must fail, or the check proves nothing.
      - name: dependabot's configuration is valid
        run: |
          set -eu
          # A pinned version (T-343); the weekly watch reads PyPI's newest.
          pipx run check-jsonschema==0.39.0 --builtin-schema vendor.dependabot .github/dependabot.yml
          sed 's/package-ecosystem: cargo$/package-ecosystem: cargoo/' .github/dependabot.yml > "$RUNNER_TEMP/planted.yml"
          if pipx run check-jsonschema==0.39.0 --builtin-schema vendor.dependabot "$RUNNER_TEMP/planted.yml"; then
            echo "the schema check is vacuous: a planted ecosystem passed"
            exit 1
          fi
          echo "the planted ecosystem failed, as it must"

      - name: shell scripts are LF and parse under dash
        run: |
          set -eu
          "$PY" scripts/check-scripts.py
          for f in scripts/*.sh; do
            dash -n "$f"
          done

      # The relay's published contract, checked live. Exit 1 means the relay
      # changed something podssh depends on: read the diff, update
      # crates/podssh-probe/facts/relay-facts.toml and docs/relay.md together.
      # Exit 2 means the relay could not be read, which is not a pass either.
      # The plants prove the check can fail.
      - name: the relay's structural facts, live
        run: |
          set -eu
          # A relay that cannot be read (exit 2) is tried twice more, 60 s
          # apart; a fact that changed (exit 1) fails at once (T-338).
          live() {
            try=1
            while :; do
              rc=0
              "$PY" scripts/check-relay-spec.py "$@" || rc=$?
              if [ "$rc" -ne 2 ] || [ "$try" -ge 3 ]; then return "$rc"; fi
              echo "the relay could not be read (try $try of 3); again in 60 s"
              try=$((try + 1))
              sleep 60
            done
          }
          live
          for plant in --plant-bad-path --plant-bad-timeout --plant-bad-cap --plant-moved-section; do
            rc=0
            live $plant || rc=$?
            if [ "$rc" -ne 1 ]; then
              echo "the fact check is vacuous: $plant exited $rc, not 1"
              exit 1
            fi
            echo "$plant exited 1, as it must"
          done
          # Each fact one line down, within its section: each holds, noted.
          live --plant-moved-line
      # The limits of /relays.json against relay-limits.toml (T-342), with the
      # same tries for a relay that cannot be read, and the check's plant.
      - name: the relay's limits, live
        run: |
          set -eu
          try=1
          while :; do
            rc=0
            "$PY" scripts/check-relay-limits.py || rc=$?
            if [ "$rc" -ne 2 ] || [ "$try" -ge 3 ]; then break; fi
            echo "the relay could not be read (try $try of 3); again in 60 s"
            try=$((try + 1))
            sleep 60
          done
          [ "$rc" -eq 0 ] || exit "$rc"
          rc=0
          "$PY" scripts/check-relay-limits.py --plant max_frame_bytes=524288 || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "the limits check is vacuous: its plant exited $rc, not 1"
            exit 1
          fi
          echo "the planted limit exited 1, as it must"

  # Windows is a released platform: each default test runs on it here, as the
  # gate runs them in Linux. The console code of Windows and the branches of
  # the token cache that are not Unix are tested nowhere else.
  windows:
    name: windows
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # aws-lc's build wants NASM on Windows, as in the release, with the
      # release's fallback: its prebuilt objects when NASM cannot be set up.
      - uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
        continue-on-error: true
      - name: NASM, or aws-lc's prebuilt objects
        shell: bash
        run: |
          if command -v nasm > /dev/null 2>&1; then
            nasm -v
          else
            echo "::warning::no NASM: aws-lc's prebuilt objects (AWS_LC_SYS_PREBUILT_NASM=1)"
            echo "AWS_LC_SYS_PREBUILT_NASM=1" >> "$GITHUB_ENV"
          fi
      # The SFTP client's tests run the sftp-server of Git for Windows.
      - name: the default tests
        env:
          PODSSH_TEST_SFTP_SERVER: C:\Program Files\Git\usr\lib\ssh\sftp-server.exe
        run: cargo test --locked --no-fail-fast
      # T-340: the test's root in the machine's ROOT store lets a server that
      # it signs through with the default trust, which the same server did not
      # get with the root out of the store; doctor names each store. The root
      # leaves the store in each case. The user's ROOT store would ask its
      # user in a dialog, which a runner cannot answer.
      - name: a root in the system's store
        shell: pwsh
        env:
          PODSSH_TEST_STORE_ROOT: ${{ runner.temp }}\store-root.cer
        run: |
          $test = "a_server_that_the_root_signs_is_trusted_through_the_store_alone"
          cargo test --locked -p podssh-ws --test system_store -- --ignored --exact the_root_is_written
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $env:PODSSH_TEST_STORE_HOLDS = "0"
          cargo test --locked -p podssh-ws --test system_store -- --ignored --exact --nocapture $test
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $added = Import-Certificate -FilePath $env:PODSSH_TEST_STORE_ROOT -CertStoreLocation Cert:\LocalMachine\Root
          try {
            $env:PODSSH_TEST_STORE_HOLDS = "1"
            cargo test --locked -p podssh-ws --test system_store -- --ignored --exact --nocapture $test
            if ($LASTEXITCODE -ne 0) { exit 1 }
            # Offline, doctor runs the checks that open nothing; its exit code
            # also counts the network's ????, so only its lines are read.
            $env:PODSSH_OFFLINE = "1"
            $doctor = & target\debug\podssh.exe doctor 2>&1 | Out-String
            Write-Output $doctor
            if ($doctor -notmatch "system stores +the current user's ROOT store: \d+ root.*; the machine's ROOT store: \d+ root") {
              Write-Output "FAIL doctor named no store"
              exit 1
            }
          } finally {
            Remove-Item -Path ("Cert:\LocalMachine\Root\" + $added.Thumbprint)
          }
      - name: repository checks
        run: python scripts/check-repo.py
      # podssh in a real pseudo console (interop-conpty.py), against the
      # OpenSSH server of MSYS2 on 127.0.0.1, which the image has at
      # C:\msys64. The keys are made for the run and deleted after it.
      - name: the console checks against MSYS2's sshd
        run: python scripts/interop-conpty-msys2.py --install --log .work/conpty.log target/debug/podssh.exe
      # Each id of interop-conpty.py, against scripts/interop-baseline.txt
      # (T-199): a check that is gone, new or renamed fails here.
      - name: the console checks against their baseline
        run: cargo todo interop --logs .work/conpty.log
      # A podssh that leaves the console raw must fail the three restore
      # checks and no other, or those checks prove nothing.
      - name: the console checks catch a planted podssh
        run: python scripts/interop-conpty-msys2.py --plant

  # The default tests on a Mac with Apple silicon, each push, as on Windows
  # (T-218): code that reads facts of Linux must do without them there. The
  # release builds and runs both Mac binaries.
  macos:
    name: macos
    runs-on: macos-15
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the default tests
        run: cargo test --locked --no-fail-fast
      # T-340: podssh reads the trust settings of the user and of the
      # administrator. A runner cannot give either a root: add-trusted-cert
      # asks for the right com.apple.trust-settings.admin in a dialog that no
      # one answers (the first run waited until the job's limit), and granting
      # the right fails as root too, "NO (-60005)", errAuthorizationDenied
      # (runs 41176904479 and 41177809365). So the step reads both domains
      # with no root of the test in them: a server that the root signs is
      # refused, and doctor names each domain with its count.
      - name: the system's trust settings, read
        timeout-minutes: 15
        env:
          PODSSH_TEST_STORE_ROOT: ${{ runner.temp }}/store-root.cer
        run: |
          set -eu
          test=a_server_that_the_root_signs_is_trusted_through_the_store_alone
          cargo test --locked -p podssh-ws --test system_store -- --ignored --exact the_root_is_written
          PODSSH_TEST_STORE_HOLDS=0 cargo test --locked -p podssh-ws --test system_store -- --ignored --exact --nocapture "$test"
          cargo build --locked -p podssh-cli
          # Offline, doctor runs the checks that open nothing; its exit code
          # also counts the network's ????, so only its lines are read.
          PODSSH_OFFLINE=1 target/debug/podssh doctor >"$RUNNER_TEMP/doctor.out" 2>&1 || true
          cat "$RUNNER_TEMP/doctor.out"
          grep -Eq "system stores +the user's trust settings: [0-9]+ root.*; the administrator's trust settings: [0-9]+ root" \
            "$RUNNER_TEMP/doctor.out" || { echo "FAIL doctor named no trust settings"; exit 1; }

  # The one status to require: each job above passed. A job that was
  # skipped or cancelled is not a pass.
  all:
    name: all
    if: always()
    needs: [plan, gate, plant, checks, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: each job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "the jobs: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != success ]; then
              echo "a job did not pass ($r)"
              exit 1
            fi
          done
