name: build

# CI runs the same gate a developer runs (`sh scripts/dev.sh check` runs
# scripts/gate.sh in the same image). Nothing is re-implemented here: each
# step of the gate runs in a job of its own, at the same time. CI adds the
# repository checks, the plant of the no-C rule, the live relay check, the
# tests on Windows, and the upload of the static binary that the gate built.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The build image and the gate's steps, each read from the tree: the
  # matrix of the job `gate` is what `gate.sh --list` prints, so it cannot
  # drift from what `sh scripts/dev.sh check` runs.
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.image.outputs.image }}
      steps: ${{ steps.steps.outputs.steps }}
    steps:
      - uses: actions/checkout@v7

      # The one place that names the build image, pinned to a digest.
      - name: the build image
        id: image
        run: |
          set -eu
          ref=$(tr -d '\r' < .github/images/build/Dockerfile | sed -n 's/^FROM[[:space:]]\{1,\}\([^[:space:]]\{1,\}\).*/\1/p')
          case "$ref" in
            *@sha256:*) echo "image=$ref" >> "$GITHUB_OUTPUT" ;;
            *) echo ".github/images/build/Dockerfile names no image pinned to a digest" >&2; exit 1 ;;
          esac

      # A list that is empty, or a name that the gate refuses, fails here
      # rather than as a matrix of no job, which would pass.
      - name: the gate's steps
        id: steps
        run: |
          set -eu
          list=$(sh scripts/gate.sh --list)
          [ -n "$list" ] || { echo "gate.sh --list printed no step" >&2; exit 1; }
          json=$(printf '%s\n' "$list" | jq -R . | jq -cs .)
          echo "steps=$json" >> "$GITHUB_OUTPUT"
          echo "the gate's steps: $json"

  gate:
    name: gate (${{ matrix.step }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        step: ${{ fromJSON(needs.plan.outputs.steps) }}
    steps:
      - uses: actions/checkout@v7

      # gate.sh caps cargo jobs from the runner's available memory.
      - name: the gate, step ${{ matrix.step }}
        env:
          BUILD_IMAGE: ${{ needs.plan.outputs.image }}
          STEP: ${{ matrix.step }}
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            -e PODSSH_TARGET=x86_64-unknown-linux-musl \
            "$BUILD_IMAGE" \
            sh scripts/gate.sh "$STEP"

      - if: matrix.step == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: podssh-x86_64-unknown-linux-musl
          path: target/x86_64-unknown-linux-musl/release/podssh
          if-no-files-found: error

  # Proves the gate's no-C-compiler rule actually fires.
  plant:
    name: plant
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: the no-C rule is load-bearing
        env:
          BUILD_IMAGE: ${{ needs.plan.outputs.image }}
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            "$BUILD_IMAGE" \
            sh scripts/plant.sh

  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Resolve python by running it: a name that prints no version is not an
      # interpreter, and a check that did not run is not a pass.
      - name: resolve the interpreter
        run: |
          set -eu
          for cand in python3 python; do
            if command -v "$cand" >/dev/null 2>&1; then
              ver=$("$cand" -c 'import sys; print("%d.%d" % sys.version_info[:2])' 2>/dev/null || true)
              case "$ver" in
                3.*)
                  echo "PY=$cand" >> "$GITHUB_ENV"
                  echo "podssh: interpreter $cand ($ver)"
                  exit 0 ;;
              esac
            fi
          done
          echo "podssh: no working python 3 on PATH" >&2
          exit 1

      - name: repository checks
        run: '"$PY" scripts/check-repo.py'

      # Each check must fail on an empty repository: a check that passes there
      # has lost its floor, and would pass a scan that read nothing.
      - name: each repository check fails on an empty tree
        run: |
          rc=0
          "$PY" scripts/check-repo.py --plant-empty || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "a check passed on an empty tree, or the plant did not run (exit $rc)"
            exit 1
          fi

      # Dependabot's configuration, against its published schema. A copy with
      # a wrong ecosystem must fail, or the check proves nothing.
      - name: dependabot's configuration is valid
        run: |
          set -eu
          pipx run check-jsonschema --builtin-schema vendor.dependabot .github/dependabot.yml
          sed 's/package-ecosystem: cargo$/package-ecosystem: cargoo/' .github/dependabot.yml > "$RUNNER_TEMP/planted.yml"
          if pipx run check-jsonschema --builtin-schema vendor.dependabot "$RUNNER_TEMP/planted.yml"; then
            echo "the schema check is vacuous: a planted ecosystem passed"
            exit 1
          fi
          echo "the planted ecosystem failed, as it must"

      - name: shell scripts are LF and parse under dash
        run: |
          set -eu
          "$PY" scripts/check-scripts.py
          for f in scripts/*.sh; do
            dash -n "$f"
          done

      # The relay's published contract, checked live. Exit 1 means the relay
      # changed something podssh depends on: read the diff, update
      # crates/podssh-probe/facts/relay-facts.toml and docs/relay.md together.
      # Exit 2 means the relay could not be read, which is not a pass either.
      # The plants prove the check can fail.
      - name: the relay's structural facts, live
        run: |
          set -eu
          "$PY" scripts/check-relay-spec.py
          for plant in --plant-bad-path --plant-bad-timeout --plant-bad-cap; do
            rc=0
            "$PY" scripts/check-relay-spec.py $plant || rc=$?
            if [ "$rc" -ne 1 ]; then
              echo "the fact check is vacuous: $plant exited $rc, not 1"
              exit 1
            fi
            echo "$plant exited 1, as it must"
          done

  # Windows is a released platform: each default test runs on it here, as the
  # gate runs them in Linux. The console code of Windows and the branches of
  # the token cache that are not Unix are tested nowhere else.
  windows:
    name: windows
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@v7
      # aws-lc's build wants NASM on Windows, as in the release.
      - uses: ilammy/setup-nasm@v1
      - name: the default tests
        run: cargo test --locked --no-fail-fast
      - name: repository checks
        run: python scripts/check-repo.py
      # podssh in a real pseudo console (interop-conpty.py), against the
      # OpenSSH server of MSYS2 on 127.0.0.1, which the image has at
      # C:\msys64. The keys are made for the run and deleted after it.
      - name: the console checks against MSYS2's sshd
        run: python scripts/interop-conpty-msys2.py --install target/debug/podssh.exe
      # A podssh that leaves the console raw must fail the three restore
      # checks and no other, or those checks prove nothing.
      - name: the console checks catch a planted podssh
        run: python scripts/interop-conpty-msys2.py --plant

  # The one status to require: each job above passed. A job that was
  # skipped or cancelled is not a pass.
  all:
    name: all
    if: always()
    needs: [plan, gate, plant, checks, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: each job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "the jobs: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != success ]; then
              echo "a job did not pass ($r)"
              exit 1
            fi
          done
