name: relay live

# The live tests of the relay that need no secret, from GitHub's network,
# where no egress proxy stands between the client and the relay (T-062), and
# the CLI's tests of a node on the live relay (node_live: T-083, T-154's idle
# session of 10 minutes, T-155's 200 MiB each way; T-251), and podssh's own
# relay role on the runner, which reaches GitHub's SSH endpoint (relay_serve:
# T-169), and its reverse road, with node_live's short tests and the client
# of the release before against it (relay_serve_reverse: T-427).
# Started by hand only. Each test mints its own tokens and pairs on the live
# relay, stops its pairs at the end, and prints no token.

on:
  workflow_dispatch:
    inputs:
      test:
        description: "The live test of podssh-relay to run"
        required: true
        type: choice
        options:
          - live_backpressure
          - reverse_live
          - node_live
          - relay_serve
          - relay_serve_reverse

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The input reaches the shell through the environment, and only a name
      # of the list runs.
      - name: build the test
        env:
          CARGO_BUILD_JOBS: "4"
          TEST: ${{ inputs.test }}
        run: |
          case "$TEST" in
            live_backpressure|reverse_live) cargo test --locked -p podssh-relay --features pair --test "$TEST" --no-run ;;
            node_live) cargo test --locked -p podssh-cli --test node_live --no-run ;;
            relay_serve) cargo build --locked -p podssh-cli && cargo test --locked -p podssh-cli --test proxy_live --no-run ;;
            relay_serve_reverse) cargo build --locked -p podssh-cli && cargo test --locked -p podssh-cli --test node_live --no-run ;;
            *) echo "not a live test of the list: $TEST" >&2; exit 2 ;;
          esac

      - name: the live test
        env:
          CARGO_BUILD_JOBS: "4"
          TEST: ${{ inputs.test }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$TEST" in
            # Each line of the node too, as a node's end is otherwise
            # unseen (T-388, T-409). OpenSSH's server is the TARGET of
            # ssh_to_a_node, in place of railway.new (T-422).
            node_live)
              command -v /usr/sbin/sshd >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q openssh-server; }
              PODSSH_TEST_NODE_LINES=1 cargo test --locked -p podssh-cli --test node_live -- --ignored --nocapture --test-threads 1 ;;
            relay_serve) sh scripts/relay-serve-live.sh target/debug/podssh ;;
            # The client of v1.0.0, the first stable release, as a user of
            # it reaches a node of a newer role.
            relay_serve_reverse)
              command -v /usr/sbin/sshd >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q openssh-server; }
              old="$RUNNER_TEMP/old"
              timeout 300 gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" \
                --pattern podssh-x86_64-unknown-linux-musl --dir "$old"
              chmod 0755 "$old/podssh-x86_64-unknown-linux-musl"
              PODSSH_OLD="$old/podssh-x86_64-unknown-linux-musl" PODSSH_TEST_NODE_LINES=1 \
                sh scripts/relay-serve-live.sh target/debug/podssh reverse ;;
            *) cargo test --locked -p podssh-relay --features pair --test "$TEST" -- --ignored --nocapture ;;
          esac
