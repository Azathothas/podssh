name: service live

# T-121: podssh node --install on a host with systemd, from GitHub's
# network: a pair on the live relay, its node made a user unit of systemd,
# started by systemd, seen online by the relay, then removed with
# --uninstall and the pair stopped. Started by hand only. No token is
# printed: the pair's tokens stay in its private file, and the unit and its
# file of variables are checked for them.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: build podssh
        env:
          CARGO_BUILD_JOBS: "4"
        run: cargo build --locked -p podssh-cli

      # One step: the target and the node's checks share its processes.
      - name: the node as a user unit
        run: |
          set -u
          bin="$PWD/target/debug/podssh"
          # A runner has no session, so its user manager runs once lingering
          # is on.
          sudo loginctl enable-linger "$USER"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          for _ in $(seq 1 30); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
          systemctl --user show-environment >/dev/null
          python3 -m http.server 8765 --bind 127.0.0.1 >/dev/null 2>&1 &
          label="svc-$GITHUB_RUN_ID"
          unit="podssh-node-$label.service"
          "$bin" relay pair "$label"
          rc=0
          "$bin" node "$label" 127.0.0.1:8765 --install || rc=$?
          echo "install: exit $rc"
          # No token of the pair in the unit or in its file of variables:
          # compared in one process, so that no token is on a command line.
          leaked=0
          python3 - "$HOME/.cache/podssh/pair-$label.json" "$HOME/.config/systemd/user/$unit" \
            "$HOME/.cache/podssh/node-$label.env" <<'EOF' || leaked=$?
          import json, os, sys
          pair = json.load(open(sys.argv[1]))
          tokens = [str(v) for k, v in pair.items() if k.endswith("token") and v]
          found = [f for f in sys.argv[2:] if os.path.exists(f) and any(t in open(f).read() for t in tokens)]
          print("a token in the unit or its variables:", "yes" if found else "no")
          sys.exit(1 if found else 0)
          EOF
          online=no
          if [ "$rc" = 0 ] && [ "$leaked" = 0 ]; then
            systemctl --user cat "$unit"
            for _ in $(seq 1 30); do
              state=$("$bin" relay status "$label" || true)
              case $state in *": online"*) online=yes; break ;; esac
              sleep 2
            done
            echo "active: $(systemctl --user is-active "$unit" || true); the relay: $state"
            journalctl --user -u "$unit" --no-pager -n 20 || true
          fi
          urc=0
          "$bin" node "$label" --uninstall || urc=$?
          left=no
          [ -e "$HOME/.config/systemd/user/$unit" ] && left=yes
          [ -e "$HOME/.cache/podssh/node-$label.env" ] && left=yes
          echo "uninstall: exit $urc; anything left: $left"
          "$bin" relay revoke "$label" || true
          [ "$rc" = 0 ] && [ "$online" = yes ] && [ "$leaked" = 0 ] && [ "$urc" = 0 ] && [ "$left" = no ]

      # T-381 (Q61): a detached run asks the user's systemd for a scope of
      # its own. The runner's processes are in no session's scope, so
      # PODSSH_SYSTEMD=yes asks; the run's cgroup must then be its scope.
      - name: a detached run in a scope of its own
        run: |
          set -u
          bin="$PWD/target/debug/podssh"
          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export XDG_RUNTIME_DIR
          for _ in $(seq 1 30); do [ -S "$XDG_RUNTIME_DIR/bus" ] && break; sleep 1; done
          out=$(PODSSH_SYSTEMD=yes timeout 30 "$bin" pipe --detach --keep-listening tcp-listen:127.0.0.1:8766 exec:cat 2>&1)
          echo "$out"
          pid=$(printf '%s' "$out" | sed -n 's/.*pid \([0-9]*\).*/\1/p' | head -1)
          log=$(printf '%s' "$out" | sed -n 's/.*its log //p' | head -1)
          [ -n "$pid" ] || { echo "FAIL no pid"; exit 1; }
          for _ in $(seq 1 50); do grep -q "scope\|stays in" "$log" 2>/dev/null && break; sleep 0.1; done
          sed 's/^/log: /' "$log"
          cg=$(sed -n 's/^0:://p' "/proc/$pid/cgroup")
          echo "the run's cgroup: $cg"
          systemctl --user status "podssh-detached-$pid.scope" --no-pager | head -5 || true
          rc=0
          case $cg in
            */podssh-detached-"$pid".scope) echo "ok    the run is in its own scope of the user's systemd" ;;
            *) echo "FAIL the run's cgroup is $cg"; rc=1 ;;
          esac
          grep -q "a logout does not end it" "$log" || { echo "FAIL the log does not say the scope"; rc=1; }
          kill "$pid" 2>/dev/null || true
          exit "$rc"

      # T-381's Prove: a run detached in a login session of logind (an SSH
      # login, whose PAM asks logind for session-N.scope) leaves it, and
      # outlives the session's end (loginctl terminate-session ends every
      # process of the scope); with PODSSH_SYSTEMD=no, the planted case, the
      # run stays in the scope and ends with it.
      - name: a detached run outlives the end of its login session
        run: |
          set -u
          bin="$PWD/target/debug/podssh"
          command -v /usr/sbin/sshd >/dev/null || { sudo apt-get update -q && sudo apt-get install -y -q openssh-server; }
          sudo mkdir -p /run/sshd
          ssh-keygen -q -t ed25519 -N '' -C scope-live -f "$RUNNER_TEMP/user_ed25519"
          sudo ssh-keygen -q -t ed25519 -N '' -C scope-live-host -f "$RUNNER_TEMP/host_ed25519"
          cp "$RUNNER_TEMP/user_ed25519.pub" "$RUNNER_TEMP/authorized_keys"
          sudo /usr/sbin/sshd -f /dev/null -E "$RUNNER_TEMP/sshd.log" -o ListenAddress=127.0.0.1:4022 \
            -o HostKey="$RUNNER_TEMP/host_ed25519" -o PidFile="$RUNNER_TEMP/sshd.pid" \
            -o AuthorizedKeysFile="$RUNNER_TEMP/authorized_keys" -o StrictModes=no -o UsePAM=yes \
            -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no
          for _ in $(seq 1 20); do (exec 3<>/dev/tcp/127.0.0.1/4022) 2>/dev/null && break; sleep 0.5; done
          echo "the user's $(loginctl show-user "$(id -u)" -p Linger 2>&1)"
          # One detached run in a login session over SSH, PODSSH_SYSTEMD=$1
          # when $1 is set; its words, then the session's id and the run's pid.
          detach_in_session() {
            out=$(timeout 60 ssh -o BatchMode=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -i "$RUNNER_TEMP/user_ed25519" -p 4022 "$(whoami)@127.0.0.1" \
              "sed -n 's/^0:://p' /proc/self/cgroup; ${1:+PODSSH_SYSTEMD=$1} $bin pipe --detach --keep-listening tcp-listen:127.0.0.1:$2 exec:cat 2>&1")
            printf '%s\n' "$out" | sed 's/^/  /' >&2
            session=$(printf '%s' "$out" | sed -n 's|.*/session-\([0-9]*\)\.scope$|\1|p' | head -1)
            pid=$(printf '%s' "$out" | sed -n 's/.*pid \([0-9]*\).*/\1/p' | head -1)
            log=$(printf '%s' "$out" | sed -n 's/.*its log //p' | head -1)
            for _ in $(seq 1 50); do grep -q "scope\|stays in" "$log" 2>/dev/null && break; sleep 0.1; done
            [ -f "$log" ] && sed 's/^/  log: /' "$log" >&2
            echo "$session $pid"
          }
          rc=0
          read -r session pid <<EOF2
          $(detach_in_session "" 8767)
          EOF2
          [ -n "$session" ] && [ -n "$pid" ] || { echo "FAIL no login session or no pid ($session, $pid)"; exit 1; }
          echo "the run's cgroup: $(sed -n 's/^0:://p' "/proc/$pid/cgroup")"
          # A session whose last process left may have ended already.
          sudo loginctl terminate-session "$session" || echo "note: session $session had ended"
          sleep 15
          if kill -0 "$pid" 2>/dev/null; then
            echo "ok    the run outlived the end of session $session, 15 s later: $(sed -n 's/^0:://p' "/proc/$pid/cgroup")"
          else
            echo "FAIL the run ended with session $session"; rc=1
          fi
          kill "$pid" 2>/dev/null || true
          read -r session pid <<EOF2
          $(detach_in_session no 8768)
          EOF2
          [ -n "$session" ] && [ -n "$pid" ] || { echo "FAIL no login session or no pid ($session, $pid)"; exit 1; }
          echo "the run's cgroup with PODSSH_SYSTEMD=no: $(sed -n 's/^0:://p' "/proc/$pid/cgroup")"
          sudo loginctl terminate-session "$session" || echo "note: session $session had ended"
          for _ in $(seq 1 30); do kill -0 "$pid" 2>/dev/null || break; sleep 0.5; done
          if kill -0 "$pid" 2>/dev/null; then
            echo "FAIL with PODSSH_SYSTEMD=no the run outlived session $session: the check proves nothing"; rc=1
            kill "$pid" 2>/dev/null || true
          else
            echo "ok    with PODSSH_SYSTEMD=no the run ended with session $session (the planted case)"
          fi
          sudo kill "$(cat "$RUNNER_TEMP/sshd.pid" 2>/dev/null)" 2>/dev/null || true
          rm -f "$RUNNER_TEMP"/user_ed25519* "$RUNNER_TEMP/authorized_keys"
          sudo rm -f "$RUNNER_TEMP"/host_ed25519*
          exit "$rc"
