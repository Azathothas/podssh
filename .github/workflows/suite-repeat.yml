name: suite repeat

# A suite of tests, run after run on one runner, each run's log kept, so
# that a test that fails at random is named (T-449): podssh-relay's suite
# with the features of the gate's relay steps, by default. Each run goes on
# after a failure, so that each failing test is counted; the job fails when
# any run failed, and the logs are an artifact. A runner of macOS, a test
# target and a filter of its tests narrow it to a test that failed there
# once, as pipe's unix-connect did at 1a38dfa. Started by hand only:
#   gh workflow run suite-repeat.yml -f runs=20
#   gh workflow run suite-repeat.yml -f runner=macos-15 -f package=podssh-cli -f features= -f test=pipe -f runs=50

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "How many runs in a row (1 to 50)"
        required: true
        default: "20"
      runner:
        description: "The runner"
        required: true
        default: "ubuntu-24.04"
        type: choice
        options:
          - ubuntu-24.04
          - macos-15
      package:
        description: "The package whose suite runs"
        required: true
        default: "podssh-relay"
      features:
        description: "Its features, comma-separated"
        required: false
        default: "pair,quick,derp,serve,piping"
      test:
        description: "One test target (--test NAME), or empty for each"
        required: false
        default: ""
      filter:
        description: "A filter of test names, or empty for each"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  repeat:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The inputs reach the shell through the environment, never through
      # its text, and each is checked before it is used.
      - name: the inputs
        shell: bash
        env:
          RUNS: ${{ inputs.runs }}
          PACKAGE: ${{ inputs.package }}
          FEATURES: ${{ inputs.features }}
          TEST: ${{ inputs.test }}
          FILTER: ${{ inputs.filter }}
        run: |
          set -u
          case $RUNS in ''|*[!0-9]*) echo "runs must be a number, not $RUNS"; exit 2 ;; esac
          [ "$RUNS" -ge 1 ] && [ "$RUNS" -le 50 ] || { echo "runs must be 1 to 50, not $RUNS"; exit 2; }
          case $PACKAGE in podssh-*) ;; *) echo "not a package of podssh: $PACKAGE"; exit 2 ;; esac
          case $PACKAGE in *[!a-z0-9-]*) echo "not a package's name: $PACKAGE"; exit 2 ;; esac
          case $FEATURES in *[!a-z0-9,-]*) echo "not a list of features: $FEATURES"; exit 2 ;; esac
          case $TEST in *[!a-z0-9_]*) echo "not a test target's name: $TEST"; exit 2 ;; esac
          case $FILTER in *[!A-Za-z0-9_:]*) echo "not a filter of test names: $FILTER"; exit 2 ;; esac
          {
            echo "RUNS=$RUNS"; echo "PACKAGE=$PACKAGE"; echo "FEATURES=$FEATURES"
            echo "TEST=$TEST"; echo "FILTER=$FILTER"
          } >> "$GITHUB_ENV"
      - name: the build of the suite
        shell: bash
        run: |
          set -u
          set -- --locked -p "$PACKAGE"
          [ -n "$FEATURES" ] && set -- "$@" --features "$FEATURES"
          [ -n "$TEST" ] && set -- "$@" --test "$TEST"
          cargo test "$@" --no-run
      # Each exit code is read directly; the shell's -e would stop at it.
      # macOS has no timeout(1): the job's own limit holds a run there.
      - name: the suite, run after run
        shell: bash
        run: |
          set -u
          mkdir -p .work/repeat
          set -- --locked -p "$PACKAGE"
          [ -n "$FEATURES" ] && set -- "$@" --features "$FEATURES"
          [ -n "$TEST" ] && set -- "$@" --test "$TEST"
          set -- "$@" --no-fail-fast
          [ -n "$FILTER" ] && set -- "$@" -- "$FILTER"
          limit=""
          command -v timeout > /dev/null 2>&1 && limit="timeout 3600"
          failed=0
          i=1
          while [ "$i" -le "$RUNS" ]; do
            rc=0
            $limit cargo test "$@" > ".work/repeat/run-$i.log" 2>&1 || rc=$?
            if [ "$rc" = 0 ]; then
              echo "run $i of $RUNS passed"
            else
              failed=$((failed + 1))
              echo "run $i of $RUNS failed (exit $rc):"
              grep -E '^test .* FAILED$|^---- .* stdout ----$|panicked at' ".work/repeat/run-$i.log" | head -20
            fi
            i=$((i + 1))
          done
          echo "the tests that failed, by the count of runs:"
          cat .work/repeat/run-*.log | grep -E '^test .* FAILED$' | sort | uniq -c | sort -rn
          echo "$failed of $RUNS runs failed"
          [ "$failed" = 0 ]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: suite-repeat-logs
          path: .work/repeat/
          retention-days: 14
