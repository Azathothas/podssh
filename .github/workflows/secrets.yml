name: secrets

# Credentials in the history of this public repository: TruffleHog over each
# commit, in its git mode only (its filesystem mode on a developer's machine
# would read .env/). On each push, each pull request and each week. CI logs
# are public, so scripts/secrets-report.py prints the findings with no secret
# in them. scripts/check-repo.py keeps podssh's own shapes of credentials,
# which TruffleHog does not know.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Each commit, not only the last one.
          fetch-depth: 0

      # The one place that names the scanner, pinned to a digest. Its pull
      # goes to a mirror of the same digest when Docker Hub refuses it.
      - name: the scanner
        run: |
          set -eu
          ref=$(tr -d '\r' < .github/images/trufflehog/Dockerfile | sed -n 's/^FROM[[:space:]]\{1,\}\([^[:space:]]\{1,\}\).*/\1/p')
          case "$ref" in
            *@sha256:*) ;;
            *) echo ".github/images/trufflehog/Dockerfile names no image pinned to a digest" >&2; exit 1 ;;
          esac
          scanner=$(sh scripts/pull-image.sh "$ref")
          echo "SCANNER=$scanner" >> "$GITHUB_ENV"

      # The mirrors work before they are needed: the scanner's digest, asked
      # of a registry that does not exist, comes from one of them.
      - name: a mirror serves a pinned image
        run: |
          set -eu
          got=$(sh scripts/pull-image.sh "registry.invalid/${SCANNER#*/}")
          case "$got" in
            registry.invalid/*) echo "the planted registry served $got" >&2; exit 1 ;;
          esac
          echo "a mirror served the scanner: $got"

      # The scan can fail: a throwaway key, made here, committed in a
      # repository of its own and used nowhere, must be found.
      - name: a planted key is found
        run: |
          set -u
          plant="$RUNNER_TEMP/plant"
          mkdir -p "$plant"
          git -C "$plant" init -q
          git -C "$plant" -c user.name=plant -c user.email=plant@example.invalid commit -q --allow-empty -m start
          ssh-keygen -q -t ed25519 -N '' -C plant -f "$plant/key"
          git -C "$plant" add key
          git -C "$plant" -c user.name=plant -c user.email=plant@example.invalid commit -q -m plant
          # The runner's shell stops at the first failure: the code is read here.
          rc=0
          docker run --rm -v "$plant:/repo:ro" "$SCANNER" git file:///repo --json --no-update \
            --no-verification --results=unverified --fail >"$RUNNER_TEMP/plant.jsonl" 2>"$RUNNER_TEMP/plant.err" || rc=$?
          rm -rf "$plant"
          if [ "$rc" -ne 183 ]; then
            echo "the scanner exited $rc on a planted key, not 183 (results found):"
            tail -20 "$RUNNER_TEMP/plant.err"
            exit 1
          fi
          python3 scripts/secrets-report.py --expect PrivateKey "$RUNNER_TEMP/plant.jsonl"

      - name: TruffleHog over the history
        run: |
          set -u
          rc=0
          docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" "$SCANNER" git file:///repo --json --no-update \
            --results=verified,unknown,unverified >"$RUNNER_TEMP/found.jsonl" 2>"$RUNNER_TEMP/scan.err" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "the scan did not run (exit $rc):"
            tail -20 "$RUNNER_TEMP/scan.err"
            exit 1
          fi
          python3 scripts/secrets-report.py --allow .github/secrets-allow.txt "$RUNNER_TEMP/found.jsonl"
