name: deny

# The advisories, licenses, duplicate versions and sources of the
# dependencies (deny.toml): on each push, each pull request and each day,
# as an advisory can come while the tree does not change.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    name: deny
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A release binary of cargo-deny, checked against its checksum.
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-deny@0.20.2

      - name: advisories, licenses, duplicates and sources
        run: cargo deny --locked check advisories licenses bans sources

      # cargo-deny passes over a path package (T-341): the advisories of
      # vendor/ and the Tailscale fork, from the copy of advisory-db that the
      # step above fetched, and the check's own plants.
      - name: the advisories of the crates built from a path
        if: ${{ !cancelled() }}
        run: python3 scripts/check-vendored-advisories.py
      - name: that check fails on planted advisories
        if: ${{ !cancelled() }}
        run: python3 scripts/check-vendored-advisories.py --self-test

      # The Tailscale fork comes with the feature ts.
      - name: licenses and sources, with each feature
        run: cargo deny --locked --all-features check licenses sources
