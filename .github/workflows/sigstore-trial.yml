name: sigstore trial

# T-210 and T-211: the steps of release.yml's job publish that make the
# proofs, run by hand on a throwaway file before a tag runs them: one
# attestation of SLSA (actions/attest) and its bundle, and the keyless
# signature of cosign, each checked with the identity of this run, and
# refused for a changed copy and for another identity. It publishes nothing:
# its proofs name a throwaway file and this branch, and its artifact lasts 3
# days. It goes once a tag's run has passed the same steps.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trial:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: a throwaway file, and its sums
        run: |
          set -eu
          mkdir -p dist
          printf 'podssh sigstore trial, run %s at %s\n' "$GITHUB_RUN_ID" "$GITHUB_SHA" > dist/podssh-trial
          cd dist
          sha256sum podssh-* > SHA256SUMS
          cat SHA256SUMS
      - name: the provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/podssh-*
      - name: the provenance's bundle, beside the files
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -eu
          cp "$BUNDLE" dist/provenance.sigstore.json
          ls -la dist
      # What the README tells a user to type, with this workflow's name; and
      # with the bundle of the files, as a check that needs no attestation
      # from the API.
      - name: the provenance, checked
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          signer="$GITHUB_REPOSITORY/.github/workflows/sigstore-trial.yml"
          verify() {
            gh attestation verify "$1" --repo "$GITHUB_REPOSITORY" --signer-workflow "$signer" --source-ref "$2" "${@:3}"
          }
          verify dist/podssh-trial "$GITHUB_REF"
          verify dist/podssh-trial "$GITHUB_REF" --bundle dist/provenance.sigstore.json
          cp dist/podssh-trial "$RUNNER_TEMP/changed"
          echo changed >> "$RUNNER_TEMP/changed"
          if verify "$RUNNER_TEMP/changed" "$GITHUB_REF"; then echo "a changed copy verified"; exit 1; fi
          if verify dist/podssh-trial refs/tags/v0.0.0-none; then echo "another ref verified"; exit 1; fi
          echo "the provenance names $signer at $GITHUB_REF; a changed copy and another ref fail"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: the signature of the sums
        run: |
          set -eu
          cd dist
          cosign version
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          issuer=https://token.actions.githubusercontent.com
          workflow="https://github.com/$GITHUB_REPOSITORY/.github/workflows/sigstore-trial.yml"
          check() {
            cosign verify-blob --bundle SHA256SUMS.sigstore.json --certificate-identity "$1" \
              --certificate-oidc-issuer "$issuer" "$2"
          }
          check "$workflow@$GITHUB_REF" SHA256SUMS
          awk 'NR == 1 { $0 = (substr($0, 1, 1) == "0" ? "1" : "0") substr($0, 2) } { print }' SHA256SUMS \
            > "$RUNNER_TEMP/changed"
          if check "$workflow@$GITHUB_REF" "$RUNNER_TEMP/changed"; then echo "a changed copy verified"; exit 1; fi
          if check "$workflow@refs/tags/v0.0.0-none" SHA256SUMS; then echo "another identity verified"; exit 1; fi
          echo "signed by $workflow@$GITHUB_REF; a changed copy and another identity fail"
      # T-211's Correction: whether cosign 2.x checks the bundle of cosign 3,
      # for the notes. A result, not a gate.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.5
          install-dir: ${{ runner.temp }}/cosign2
      - name: cosign 2.x on the same bundle
        run: |
          cd dist
          c2="$RUNNER_TEMP/cosign2/cosign"
          "$c2" version
          workflow="https://github.com/$GITHUB_REPOSITORY/.github/workflows/sigstore-trial.yml@$GITHUB_REF"
          for extra in "" --new-bundle-format; do
            if "$c2" verify-blob $extra --bundle SHA256SUMS.sigstore.json --certificate-identity "$workflow" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com SHA256SUMS; then
              echo "cosign 2.6.5 ${extra:-with no flag}: verified"
            else
              echo "cosign 2.6.5 ${extra:-with no flag}: refused"
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: sigstore-trial
          path: dist/*
          retention-days: 3
          if-no-files-found: error
