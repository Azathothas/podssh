name: warp live

# T-352: WARP's MASQUE road over HTTP/2, live, with the operator's leave
# (Q52, docs/decisions.md): podssh with the feature warp, built from this
# commit, registers one device with WARP's API (PODSSH_WARP_ACCEPT_TERMS=yes
# accepts Cloudflare's Terms for this run) and keeps its record in a cache
# directory of this run, in a run of podssh ssh -v to GitHub's refusal of a
# client with no key; then the banner of GitHub's SSH endpoint through
# podssh proxy warp://, directly and through the box's proxy, which allows
# port 443 alone (scripts/box/proxy.py, the measured cage's policy), so that
# port 22 is reached only inside WARP's tunnel; OpenSSH's ssh to GitHub
# with podssh proxy as its ProxyCommand, to the refusal of a client with no
# key; and the box's proxy with names alone, which refuses the endpoint's
# address and is named. Started by hand only, with confirm=Q52; a few
# minutes. The device's id, token and key stay in its record, a private
# file that is removed at the end; no line prints them.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Q52: the operator's leave for a run against WARP"
        required: true

permissions:
  contents: read

env:
  PODSSH_CACHE_DIR: ${{ github.workspace }}/../podssh-cache
  # GitHub's published Ed25519 host key (docs.github.com, "GitHub's SSH key
  # fingerprints"), as docs/STATUS.md records it through the relay.
  GITHUB_ED25519: "SHA256:+DiY3wvvV6TuJJhbpZisF/zLDA0zPMSvHdkr4UvCOqU"

concurrency:
  group: warp-live
  cancel-in-progress: false

jobs:
  live:
    if: inputs.confirm == 'Q52'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: podssh with the feature warp, built from this commit
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          timeout 1200 cargo build -p podssh-cli --locked --features warp
          target/debug/podssh --version
          mkdir -p "$PODSSH_CACHE_DIR"

      - name: podssh ssh -v to GitHub inside WARP's tunnel, which registers the device
        run: |
          set +e
          PODSSH_WARP_ACCEPT_TERMS=yes timeout 120 target/debug/podssh ssh -v -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts_podssh" \
            warp://git@github.com </dev/null >"$RUNNER_TEMP/ssh.out" 2>"$RUNNER_TEMP/ssh.log"
          rc=$?
          set -e
          sed 's/^/podssh: /' "$RUNNER_TEMP/ssh.log"
          echo "podssh ssh exited $rc"
          [ -s "$PODSSH_CACHE_DIR/warp-device.json" ] || { echo "FAIL the device's record was not kept"; exit 1; }
          [ "$(stat -c %a "$PODSSH_CACHE_DIR/warp-device.json")" = 600 ] || { echo "FAIL the record is not 0600"; exit 1; }
          echo "ok    the device's record is kept, mode 0600"
          grep -q "Permission denied (publickey)" "$RUNNER_TEMP/ssh.log" || { echo "FAIL no refusal of GitHub's ($rc)"; exit 1; }
          [ "$rc" = 255 ] || { echo "FAIL exit $rc, not 255"; exit 1; }
          # The far end is GitHub itself: its published Ed25519 key.
          ssh-keygen -lf "$RUNNER_TEMP/known_hosts_podssh" | tee "$RUNNER_TEMP/keys.txt"
          grep -q "$GITHUB_ED25519" "$RUNNER_TEMP/keys.txt" || { echo "FAIL the host key is not GitHub's published one"; exit 1; }
          echo "ok    the SSH handshake with GitHub passed inside WARP, to the refusal of a client with no key"

      # A client's banner, then stdin held open: a server may close a
      # connection whose client ends at once, before its own banner.
      - name: GitHub's SSH banner inside WARP's tunnel, directly
        run: |
          set +e
          { printf 'SSH-2.0-podssh_live\r\n'; sleep 10; } | PODSSH_SESSION_LOG="$RUNNER_TEMP/direct.jsonl" \
            timeout 60 target/debug/podssh proxy warp://github.com:22 2>"$RUNNER_TEMP/direct.log" >"$RUNNER_TEMP/direct.out"
          rc=$?
          set -e
          sed 's/^/podssh: /' "$RUNNER_TEMP/direct.log"
          echo "podssh proxy exited $rc"
          cat "$RUNNER_TEMP/direct.jsonl" 2>/dev/null | sed 's/^/session: /' || true
          grep -q "registering a device" "$RUNNER_TEMP/direct.log" && { echo "FAIL a second registration"; exit 1; }
          banner=$(head -c 64 "$RUNNER_TEMP/direct.out" | tr -d '\r' | head -n 1)
          case $banner in
            SSH-2.0-*) echo "ok    the banner of github.com:22 came through WARP: $banner" ;;
            *) echo "FAIL no SSH banner through WARP"; exit 1 ;;
          esac

      - name: the same through the box's proxy, which allows port 443 alone
        run: |
          python3 scripts/box/proxy.py --listen 127.0.0.1:3128 >"$RUNNER_TEMP/proxy.log" 2>&1 &
          sleep 1
          set +e
          { printf 'SSH-2.0-podssh_live\r\n'; sleep 10; } | HTTPS_PROXY=http://127.0.0.1:3128 \
            timeout 60 target/debug/podssh proxy warp://github.com:22 2>"$RUNNER_TEMP/proxied.log" >"$RUNNER_TEMP/proxied.out"
          rc=$?
          set -e
          sed 's/^/podssh: /' "$RUNNER_TEMP/proxied.log"
          echo "podssh proxy exited $rc"
          sed 's/^/proxy: /' "$RUNNER_TEMP/proxy.log"
          grep -q "registering a device" "$RUNNER_TEMP/proxied.log" && { echo "FAIL a second registration"; exit 1; }
          grep -q "CONNECT 162.159.198.2:443" "$RUNNER_TEMP/proxy.log" || { echo "FAIL the proxy saw no CONNECT to the endpoint"; exit 1; }
          if grep -q ":22 " "$RUNNER_TEMP/proxy.log"; then echo "FAIL port 22 went to the proxy"; exit 1; fi
          banner=$(head -c 64 "$RUNNER_TEMP/proxied.out" | tr -d '\r' | head -n 1)
          case $banner in
            SSH-2.0-*) echo "ok    through a proxy of port 443 alone, the banner of github.com:22 came inside WARP" ;;
            *) echo "FAIL no SSH banner through the proxy"; exit 1 ;;
          esac

      - name: OpenSSH's ssh to GitHub, with podssh proxy warp:// as its ProxyCommand
        run: |
          set +e
          out=$(HTTPS_PROXY=http://127.0.0.1:3128 timeout 90 ssh -T -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            -o UserKnownHostsFile="$RUNNER_TEMP/known_hosts" -o GlobalKnownHostsFile=/dev/null \
            -o IdentitiesOnly=yes -o IdentityFile=/dev/null \
            -o ProxyCommand="$PWD/target/debug/podssh proxy warp://%h:%p" git@github.com 2>&1)
          rc=$?
          set -e
          echo "$out" | sed 's/^/ssh: /'
          echo "$out" | grep -q "Permission denied (publickey)" || { echo "FAIL ssh did not reach GitHub's refusal ($rc)"; exit 1; }
          # The runner's global file holds github.com's keys; with it set
          # aside, OpenSSH records the key that it was shown.
          ssh-keygen -lf "$RUNNER_TEMP/known_hosts" | tee "$RUNNER_TEMP/keys-openssh.txt"
          grep -q "$GITHUB_ED25519" "$RUNNER_TEMP/keys-openssh.txt" || { echo "FAIL the host key is not GitHub's published one"; exit 1; }
          echo "ok    the SSH handshake with GitHub passed inside WARP, to the refusal of a client with no key"

      - name: a proxy of names alone refuses the endpoint's address, and is named
        run: |
          python3 scripts/box/proxy.py --listen 127.0.0.1:3129 --take names >"$RUNNER_TEMP/names.log" 2>&1 &
          sleep 1
          set +e
          HTTPS_PROXY=http://127.0.0.1:3129 timeout 90 target/debug/podssh proxy warp://github.com:22 \
            </dev/null >/dev/null 2>"$RUNNER_TEMP/names-podssh.log"
          rc=$?
          set -e
          sed 's/^/podssh: /' "$RUNNER_TEMP/names-podssh.log"
          [ "$rc" = 69 ] || { echo "FAIL exit $rc, not 69"; exit 1; }
          grep -q "refused CONNECT 162.159.198.2:443" "$RUNNER_TEMP/names-podssh.log" || { echo "FAIL the refusal was not named"; exit 1; }
          echo "ok    a proxy of names alone: exit 69, the refusal of the address named"

      - name: the end
        if: always()
        run: |
          pkill -f scripts/box/proxy.py || true
          rm -rf "$PODSSH_CACHE_DIR"
