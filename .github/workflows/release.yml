name: release

# A tag `vX.Y.Z[-pre]` builds the release binaries and publishes them, with
# checksums, as a GitHub release (a prerelease when the tag has a suffix).
# The notes come from docs/releases/<tag>.md, which must exist. Run by hand
# (workflow_dispatch), it builds and checks the same binaries, makes the
# files and the body that the tag of Cargo.toml's version would publish, with
# the same checks, keeps them as workflow artifacts, and publishes nothing.
# Run by hand with the input `publish` set to that tag, it makes the tag at
# the commit that it was started on and starts itself on the tag, which then
# builds and publishes as a tag's run: a session whose git may not push a
# tag (a Claude Code cloud session, HTTP 403) releases this way. A tag's run
# attests the binaries (T-210) and signs SHA256SUMS (T-211), and each proof
# names the tag: a run by hand on a branch makes neither.
#
# Linux binaries are static musl, built in the same image as the gate
# (rust:1-alpine) on a native runner for each architecture, and checked for
# dynamic dependencies before they are published; armv7 is built with
# Alpine's own rust in a container of linux/arm/v7 on an arm64 runner, and
# riscv64 cross-compiled with cargo-zigbuild in the gate's image (T-218). The Windows binaries, for x86_64 and ARM64, are linked with a
# static C runtime; the Mac binaries, for ARM and Intel, link the system's
# libraries only. Each binary runs the short form of the release check on
# its own platform (scripts/release-short.sh, with GitHub's SSH banner
# through the live relay): no target ships that no run executed. A build
# for a host triple names it as --target, so that +crt-static reaches the
# binary and not the proc-macros of the host. Each build names its commit
# to the compiler, and --version prints it (T-210).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: "The tag to publish, v and the version of Cargo.toml; empty: a dry run"
        required: false
        default: ""
      nasm:
        description: "NASM for aws-lc on Windows x86-64: setup, or prebuilt, its fallback, to prove it"
        required: false
        default: setup
        type: choice
        options: [setup, prebuilt]

permissions:
  contents: read

# The commit that each binary names in --version (T-210), read at compile
# time; a container gets it with -e.
env:
  PODSSH_BUILD_COMMIT: ${{ github.sha }}

jobs:
  # A tag that git pushes with the job's token starts no workflow, and a
  # dispatch does: so the tag's run is started by name, once the tag is
  # there. GitHub may need a moment to see a new ref.
  tag:
    if: github.event_name == 'workflow_dispatch' && inputs.publish != '' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the tag, and the release's run on it
        env:
          PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          want=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          test "$PUBLISH" = "v$want" || { echo "the input publish $PUBLISH is not v$want"; exit 1; }
          if [ -n "$(git ls-remote --tags origin "refs/tags/$PUBLISH")" ]; then echo "the tag $PUBLISH exists already"; exit 1; fi
          git tag "$PUBLISH" "$GITHUB_SHA"
          git push origin "refs/tags/$PUBLISH"
          for try in 1 2 3 4 5 6; do
            if gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$PUBLISH"; then
              echo "the tag $PUBLISH at $GITHUB_SHA; the release runs on it"
              exit 0
            fi
            echo "the dispatch on $PUBLISH failed (try $try); again in 10 s"
            sleep 10
          done
          echo "the tag $PUBLISH is made, and no run started on it: start one by hand on the tag"
          exit 1

  linux:
    if: inputs.publish == '' || startsWith(github.ref, 'refs/tags/')
    name: linux ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The one place that names the build image, pinned to a digest.
      - name: the build image
        run: |
          set -eu
          ref=$(tr -d '\r' < images/build/Dockerfile | sed -n 's/^FROM[[:space:]]\{1,\}\([^[:space:]]\{1,\}\).*/\1/p')
          case "$ref" in
            *@sha256:*) echo "BUILD_IMAGE=$ref" >> "$GITHUB_ENV" ;;
            *) echo "images/build/Dockerfile names no image pinned to a digest" >&2; exit 1 ;;
          esac
      - name: build (static musl, in the gate's image)
        # A mirror serves the same digest when Docker Hub refuses the pull.
        run: |
          image=$(sh scripts/pull-image.sh "$BUILD_IMAGE")
          docker run --rm -v "$PWD:/work" -w /work \
            -e CARGO_BUILD_JOBS=4 -e RUSTFLAGS=-Ctarget-feature=+crt-static -e PODSSH_BUILD_COMMIT \
            "$image" \
            cargo build --locked --release --target ${{ matrix.target }} -p podssh-cli
      - name: the binary is static
        run: |
          set -eu
          B=target/${{ matrix.target }}/release/podssh
          if readelf -d "$B" | grep -q NEEDED; then echo "dynamic dependencies:"; readelf -d "$B"; exit 1; fi
          if readelf -l "$B" | grep -q INTERP; then echo "asks for a program interpreter"; exit 1; fi
          file "$B"
          "$B" --version
      # The binary prints the version of Cargo.toml and its commit, and a tag
      # names that version.
      - name: the version of the binary
        run: |
          set -eu
          want=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          case "$GITHUB_REF" in
            refs/tags/v*) test "$GITHUB_REF_NAME" = "v$want" || { echo "the tag $GITHUB_REF_NAME is not v$want"; exit 1; } ;;
          esac
          got=$(target/${{ matrix.target }}/release/podssh --version)
          test "$got" = "podssh $want ($PODSSH_BUILD_COMMIT)" ||
            { echo "the binary prints \"$got\", not \"podssh $want ($PODSSH_BUILD_COMMIT)\""; exit 1; }
      - name: the binary runs
        run: sh scripts/release-short.sh target/${{ matrix.target }}/release/podssh --net
      - name: package
        run: |
          set -eu
          mkdir -p dist
          cp target/${{ matrix.target }}/release/podssh dist/podssh-${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: podssh-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # A Raspberry Pi with 32 bits: Alpine's own toolchain for armv7, in a
  # container of linux/arm/v7 on an arm64 runner. The runner's CPU runs
  # 32-bit code where its kernel allows it; a probe decides, and QEMU stands
  # in where it does not.
  linux-armv7:
    if: inputs.publish == '' || startsWith(github.ref, 'refs/tags/')
    name: linux armv7-unknown-linux-musleabihf
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the image
        run: |
          set -eu
          ref=$(tr -d '\r' < images/armv7/Dockerfile | sed -n 's/^FROM[[:space:]]\{1,\}\([^[:space:]]\{1,\}\).*/\1/p')
          case "$ref" in
            *@sha256:*) echo "ARMV7_IMAGE=$(PULL_PLATFORM=linux/arm/v7 sh scripts/pull-image.sh "$ref")" >> "$GITHUB_ENV" ;;
            *) echo "images/armv7/Dockerfile names no image pinned to a digest" >&2; exit 1 ;;
          esac
      - name: does the runner run 32-bit ARM?
        id: probe
        run: |
          if docker run --rm --platform linux/arm/v7 "$ARMV7_IMAGE" uname -m; then
            echo "native=yes" >> "$GITHUB_OUTPUT"
          else
            echo "native=no" >> "$GITHUB_OUTPUT"
          fi
      # QEMU's handler, from the pinned image of images/binfmt.
      - if: steps.probe.outputs.native != 'yes'
        name: QEMU for 32-bit ARM
        run: sh scripts/binfmt.sh arm
      - name: build (static musl, Alpine's rust for armv7)
        run: |
          docker run --rm --platform linux/arm/v7 -v "$PWD:/work" -w /work \
            -e CARGO_BUILD_JOBS=4 -e RUSTFLAGS=-Ctarget-feature=+crt-static -e PODSSH_BUILD_COMMIT \
            "$ARMV7_IMAGE" sh -c 'apk add --no-cache build-base rust cargo >/dev/null && rustc -vV &&
              t=$(rustc -vV | sed -n "s/^host: //p") && cargo build --locked --release --target "$t" -p podssh-cli &&
              mkdir -p dist && cp "target/$t/release/podssh" dist/podssh-armv7-unknown-linux-musleabihf'
      - name: the binary is static
        run: |
          set -eu
          B=dist/podssh-armv7-unknown-linux-musleabihf
          file "$B"
          if readelf -d "$B" | grep -q NEEDED; then echo "dynamic dependencies:"; readelf -d "$B"; exit 1; fi
          if readelf -l "$B" | grep -q INTERP; then echo "asks for a program interpreter"; exit 1; fi
          readelf -h "$B" | grep -E 'Class|Machine|Flags'
      - name: the binary runs
        run: |
          docker run --rm --platform linux/arm/v7 -v "$PWD:/work" -w /work -e PODSSH_BUILD_COMMIT "$ARMV7_IMAGE" \
            sh scripts/release-short.sh dist/podssh-armv7-unknown-linux-musleabihf --net
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: podssh-armv7-unknown-linux-musleabihf
          path: dist/*
          if-no-files-found: error

  # riscv64, cross-compiled by the operator's call (2026-10-30): the gate's
  # own image on a native runner, with zig and cargo-zigbuild, in about 5
  # min where the build under QEMU took 88; the binary then runs on the
  # runner under QEMU.
  linux-riscv64:
    if: inputs.publish == '' || startsWith(github.ref, 'refs/tags/')
    name: linux riscv64gc-unknown-linux-musl
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # zig from ziglang.org, checked by the sum of its download index;
      # cargo-zigbuild from crates.io, built with its own lock file.
      ZIG_VERSION: 0.16.0
      ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
      ZIGBUILD_VERSION: 0.23.4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: the build image
        run: |
          set -eu
          ref=$(tr -d '\r' < images/build/Dockerfile | sed -n 's/^FROM[[:space:]]\{1,\}\([^[:space:]]\{1,\}\).*/\1/p')
          case "$ref" in
            *@sha256:*) echo "BUILD_IMAGE=$(sh scripts/pull-image.sh "$ref")" >> "$GITHUB_ENV" ;;
            *) echo "images/build/Dockerfile names no image pinned to a digest" >&2; exit 1 ;;
          esac
      - name: build (static musl, cross-compiled with cargo-zigbuild in the gate's image)
        run: |
          start=$(date +%s)
          docker run --rm -v "$PWD:/work" -w /work \
            -e CARGO_BUILD_JOBS=4 -e RUSTFLAGS=-Ctarget-feature=+crt-static -e PODSSH_BUILD_COMMIT \
            -e ZIG_VERSION -e ZIG_SHA256 -e ZIGBUILD_VERSION \
            "$BUILD_IMAGE" sh -c '
              set -eu
              rustc -vV
              z="zig-x86_64-linux-$ZIG_VERSION"
              wget -q -O "/tmp/$z.tar.xz" "https://ziglang.org/download/$ZIG_VERSION/$z.tar.xz"
              echo "$ZIG_SHA256  /tmp/$z.tar.xz" | sha256sum -c -
              xzcat "/tmp/$z.tar.xz" | tar -x -C /tmp
              export PATH="/tmp/$z:$PATH"
              echo "zig $(zig version)"
              # A host build: +crt-static with no --target would reach its
              # proc-macros on this musl host.
              RUSTFLAGS= cargo install --quiet --locked --root /tmp/zigbuild cargo-zigbuild --version "$ZIGBUILD_VERSION"
              export PATH="/tmp/zigbuild/bin:$PATH"
              cargo install --list --root /tmp/zigbuild
              rustup target add riscv64gc-unknown-linux-musl
              cargo zigbuild --locked --release --target riscv64gc-unknown-linux-musl -p podssh-cli
              mkdir -p dist
              cp target/riscv64gc-unknown-linux-musl/release/podssh dist/podssh-riscv64gc-unknown-linux-musl'
          echo "the build took $(( $(date +%s) - start )) s"
      - name: the binary is static
        run: |
          set -eu
          B=dist/podssh-riscv64gc-unknown-linux-musl
          file "$B"
          if readelf -d "$B" | grep -q NEEDED; then echo "dynamic dependencies:"; readelf -d "$B"; exit 1; fi
          if readelf -l "$B" | grep -q INTERP; then echo "asks for a program interpreter"; exit 1; fi
          readelf -h "$B" | grep -E 'Class|Machine|Flags'
      # The handler of binfmt that QEMU registers runs a static riscv64 binary
      # on the runner itself, so the check needs no second image; the handler
      # comes from the pinned image of images/binfmt.
      - name: QEMU for riscv64
        run: sh scripts/binfmt.sh riscv64
      - name: the binary runs (under QEMU)
        run: sh scripts/release-short.sh dist/podssh-riscv64gc-unknown-linux-musl --net
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: podssh-riscv64gc-unknown-linux-musl
          path: dist/*
          if-no-files-found: error

  macos:
    if: inputs.publish == '' || startsWith(github.ref, 'refs/tags/')
    name: macos ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          # The last image of Actions for x86_64 Macs, until August 2027.
          - runner: macos-15-intel
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: build
        run: cargo build --locked --release --target ${{ matrix.target }} -p podssh-cli
      # A Mac binary links libSystem at least; nothing outside the system.
      - name: the binary links the system's libraries only
        run: |
          set -eu
          B=target/${{ matrix.target }}/release/podssh
          file "$B"
          otool -L "$B"
          if otool -L "$B" | tail -n +2 | grep -v -E '^[[:space:]]+(/usr/lib/|/System/Library/)'; then
            echo "a library outside the system's"
            exit 1
          fi
      - name: the binary runs
        run: sh scripts/release-short.sh target/${{ matrix.target }}/release/podssh --net
      - name: package
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/podssh dist/podssh-${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: podssh-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  windows:
    if: inputs.publish == '' || startsWith(github.ref, 'refs/tags/')
    name: windows ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            tools: Hostx64\x64
            machine: 8664 machine
          # aws-lc on ARM64 Windows wants clang-cl, which the image has, and
          # no NASM.
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            tools: Hostarm64\arm64
            machine: AA64 machine
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
      RUSTFLAGS: -Ctarget-feature=+crt-static
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # aws-lc's build needs NASM on Windows x86-64: with no NASM it stops,
      # unless AWS_LC_SYS_PREBUILT_NASM=1 asks for its prebuilt objects
      # (aws-lc-sys 0.46, builder/main.rs), its fallback here. The release
      # assembles them itself, and takes the prebuilt ones, with a warning,
      # when NASM cannot be set up, or when a run by hand asks for them with
      # the input nasm, which proves the fallback (T-337).
      - if: matrix.target == 'x86_64-pc-windows-msvc' && inputs.nasm != 'prebuilt'
        continue-on-error: true
        uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2
      - if: matrix.target == 'x86_64-pc-windows-msvc'
        name: NASM, or aws-lc's prebuilt objects
        shell: bash
        env:
          NASM_INPUT: ${{ inputs.nasm }}
        run: |
          if [ "$NASM_INPUT" != prebuilt ] && command -v nasm > /dev/null 2>&1; then
            nasm -v
          else
            command -v nasm || echo "no NASM on PATH"
            echo "::warning::no NASM: aws-lc's prebuilt objects (AWS_LC_SYS_PREBUILT_NASM=1)"
            echo "AWS_LC_SYS_PREBUILT_NASM=1" >> "$GITHUB_ENV"
          fi
      - name: build
        run: cargo build --locked --release -p podssh-cli
      - name: package
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          cp target/release/podssh.exe dist/podssh-${{ matrix.target }}.exe
      - name: the binary needs no C runtime DLL
        shell: pwsh
        env:
          TOOLS: ${{ matrix.tools }}
          MACHINE: ${{ matrix.machine }}
          BINARY: dist\podssh-${{ matrix.target }}.exe
        run: |
          # dumpbin ships with the runner's Visual Studio, off PATH; vswhere,
          # installed with it, finds it: the tools of this host first, then
          # any host's.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\**\bin\$env:TOOLS\dumpbin.exe" |
            Select-Object -First 1
          if (-not $dumpbin) {
            $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\**\bin\Host*\*\dumpbin.exe" |
              Select-Object -First 1
          }
          if (-not $dumpbin) { Write-Error "dumpbin was not found"; exit 1 }
          $deps = & $dumpbin /headers /dependents $env:BINARY | Out-String
          if ($LASTEXITCODE -ne 0) { Write-Error "dumpbin failed"; exit 1 }
          Write-Output ($deps -split "`n" | Select-String -Pattern 'machine|\.dll' | Out-String)
          if (-not $deps.Contains($env:MACHINE)) { Write-Error "not a binary of $env:MACHINE"; exit 1 }
          if ($deps -match '(?i)vcruntime|msvcp|ucrtbase|api-ms-win-crt') {
            Write-Error "the binary links a C runtime DLL"
            exit 1
          }
      - name: the binary runs
        shell: bash
        run: sh scripts/release-short.sh dist/podssh-${{ matrix.target }}.exe --net
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: podssh-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  # The notices of the third-party licenses and the list of the commits,
  # made with tools of third parties (cargo-about, git-cliff) in a job that
  # can write nothing and holds no token of the release: the job that
  # attests, signs and publishes runs no tool of a third party (T-337).
  notes:
    if: inputs.publish == '' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # git-cliff reads the commits since the previous tag.
          fetch-depth: 0
      # Release binaries of both tools, each checked against its checksum:
      # no crate is built for the notes.
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-about@0.9.2,git-cliff@2.9.1
      # The licenses of the crates in the binaries, with their texts: the
      # notices that Apache-2.0 and the BSD licenses ask a binary to carry.
      - name: the notices of the third-party licenses
        run: |
          set -eu
          mkdir -p notes
          cargo about generate --manifest-path crates/podssh-cli/Cargo.toml --locked -c about.toml about.hbs \
            -o notes/THIRD-PARTY-LICENSES.md
          test -s notes/THIRD-PARTY-LICENSES.md
      # The commits of this release, each one, from cliff.toml: on a tag, those
      # since the tag before it; by hand, where the tag does not exist yet,
      # those since the last tag.
      - name: the list of the commits (git-cliff, pinned)
        run: |
          set -eu
          case "$GITHUB_REF" in
            refs/tags/v*) range=--latest ;;
            *) range=--unreleased ;;
          esac
          git cliff --config cliff.toml "$range" --strip all > notes/changes.md
          test -s notes/changes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notes
          path: notes/*
          if-no-files-found: error

  # On a tag it publishes. Run by hand, each step but the proofs and the
  # last runs, and the files and the body are an artifact: the steps of a
  # release are proved before its tag, which never moves. A run by hand with
  # the input publish builds nothing, so this job does not run in it. It runs
  # GitHub's actions and Sigstore's installer of cosign, each pinned by its
  # commit, and no other tool: it holds the rights to write the release and
  # to sign as this workflow (T-337).
  publish:
    needs: [linux, linux-armv7, linux-riscv64, macos, windows, notes]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: podssh-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notes
          path: ${{ runner.temp }}/notes
      - name: the notices of the third-party licenses
        run: |
          set -eu
          cp "$RUNNER_TEMP/notes/THIRD-PARTY-LICENSES.md" dist/THIRD-PARTY-LICENSES.md
          test -s dist/THIRD-PARTY-LICENSES.md
          test -s "$RUNNER_TEMP/notes/changes.md"
      - name: checksums
        run: |
          set -eu
          cd dist
          sha256sum podssh-* > SHA256SUMS
          cat SHA256SUMS
      # The provenance of each binary (T-210): one attestation of SLSA,
      # signed with Sigstore through the job's own token, that names each
      # file, this workflow and the commit of the tag. Its bundle goes with
      # the files, for a check with no network.
      - name: the provenance of the binaries
        id: attest
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/podssh-*
      - name: the provenance's bundle, beside the files
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: cp "$BUNDLE" dist/provenance.sigstore.json
      # Checked as a user checks it, before anything is published: each
      # binary against the bundle, with this workflow and the tag; a changed
      # copy must fail.
      - name: the provenance, checked
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          signer="$GITHUB_REPOSITORY/.github/workflows/release.yml"
          verify() {
            gh attestation verify "$1" --repo "$GITHUB_REPOSITORY" --bundle dist/provenance.sigstore.json \
              --signer-workflow "$signer" --source-ref "$GITHUB_REF" > /dev/null
          }
          for f in dist/podssh-*; do
            verify "$f"
            echo "ok   $f"
          done
          cp dist/podssh-x86_64-unknown-linux-musl "$RUNNER_TEMP/changed"
          echo changed >> "$RUNNER_TEMP/changed"
          if verify "$RUNNER_TEMP/changed" 2> /dev/null; then echo "a changed copy verified"; exit 1; fi
          echo "each binary names $signer at $GITHUB_REF; a changed copy fails"
      # The signature of SHA256SUMS (T-211): keyless, with Sigstore, by the
      # job's own token; its identity is this workflow at the tag. It is
      # checked at once with that identity, and must fail on a changed copy
      # and on the identity of a branch.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.4
      - name: the signature of the checksums
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          cd dist
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS
          issuer=https://token.actions.githubusercontent.com
          workflow="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml"
          check() {
            cosign verify-blob --bundle SHA256SUMS.sigstore.json --certificate-identity "$1" \
              --certificate-oidc-issuer "$issuer" "$2"
          }
          check "$workflow@$GITHUB_REF" SHA256SUMS
          awk 'NR == 1 { $0 = (substr($0, 1, 1) == "0" ? "1" : "0") substr($0, 2) } { print }' SHA256SUMS \
            > "$RUNNER_TEMP/changed"
          if check "$workflow@$GITHUB_REF" "$RUNNER_TEMP/changed"; then echo "a changed copy verified"; exit 1; fi
          if check "$workflow@refs/heads/main" SHA256SUMS; then echo "a branch's identity verified"; exit 1; fi
          echo "signed by $workflow@$GITHUB_REF; a changed copy and a branch's identity fail"
      # The tag, or by hand the tag of Cargo.toml's version: they must agree.
      # The job tag makes a new tag only, which must not exist: a tag never
      # moves.
      - name: the tag
        run: |
          set -eu
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          case "$GITHUB_REF" in
            refs/tags/v*) tag=$GITHUB_REF_NAME ;;
            *) tag="v$version" ;;
          esac
          test "$tag" = "v$version" || { echo "the tag $tag is not v$version, the version of Cargo.toml"; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: the body of the release
        run: |
          set -eu
          notes="docs/releases/$TAG.md"
          if [ ! -f "$notes" ]; then echo "missing release notes: $notes"; exit 1; fi
          {
            cat "$notes"
            printf '\nThe licenses of the crates in the binaries, with their texts: THIRD-PARTY-LICENSES.md.\n'
            printf '\n## The commits of this release\n\n'
          } > "$RUNNER_TEMP/body.md"
          # GitHub refuses a body of more than 125,000 characters. A character
          # is at least one byte, so a count of bytes errs on the safe side.
          budget=$((120000 - $(wc -c < "$RUNNER_TEMP/body.md")))
          if [ "$(wc -c < "$RUNNER_TEMP/notes/changes.md")" -le "$budget" ]; then
            cat "$RUNNER_TEMP/notes/changes.md" >> "$RUNNER_TEMP/body.md"
          else
            # After the checksums: CHANGES.md is not a binary.
            cp "$RUNNER_TEMP/notes/changes.md" dist/CHANGES.md
            printf 'The list is cut; CHANGES.md, among the files, holds each commit.\n\n' >> "$RUNNER_TEMP/body.md"
            head -c "$((budget - 200))" "$RUNNER_TEMP/notes/changes.md" | sed '$d' >> "$RUNNER_TEMP/body.md"
          fi
          size=$(wc -c < "$RUNNER_TEMP/body.md")
          echo "the body: $size bytes; the list: $(grep -c '^- ' "$RUNNER_TEMP/notes/changes.md" || true) commits"
          test "$size" -lt 125000
      # On a tag's run, the tag that is there: one that git pushed, or one
      # that the job tag made.
      - name: publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" $pre --verify-tag --title "podssh $TAG" --notes-file "$RUNNER_TEMP/body.md" dist/*
      - name: the files and the body that a tag would publish
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: cp "$RUNNER_TEMP/body.md" dist/BODY.md
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dry-run
          path: dist/*
          if-no-files-found: error
