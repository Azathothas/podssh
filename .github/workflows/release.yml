name: release

# A tag `vX.Y.Z[-pre]` builds the release binaries and publishes them, with
# checksums, as a GitHub release (a prerelease when the tag has a suffix).
# The notes come from docs/releases/<tag>.md, which must exist. Run by hand
# (workflow_dispatch), it builds and checks the same binaries, makes the
# files and the body that the tag of Cargo.toml's version would publish, with
# the same checks, keeps them as workflow artifacts, and publishes nothing.
#
# Linux binaries are static musl, built in the same image as the gate
# (rust:1-alpine) on a native runner for each architecture, and checked for
# dynamic dependencies before they are published. The Windows binary is
# linked with a static C runtime.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: linux ${{ matrix.target }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      # The one place that names the build image, pinned to a digest.
      - name: the build image
        run: |
          set -eu
          ref=$(tr -d '\r' < .github/images/build/Dockerfile | sed -n 's/^FROM[[:space:]]\{1,\}\([^[:space:]]\{1,\}\).*/\1/p')
          case "$ref" in
            *@sha256:*) echo "BUILD_IMAGE=$ref" >> "$GITHUB_ENV" ;;
            *) echo ".github/images/build/Dockerfile names no image pinned to a digest" >&2; exit 1 ;;
          esac
      - name: build (static musl, in the gate's image)
        # A mirror serves the same digest when Docker Hub refuses the pull.
        run: |
          image=$(sh scripts/pull-image.sh "$BUILD_IMAGE")
          docker run --rm -v "$PWD:/work" -w /work \
            -e CARGO_BUILD_JOBS=4 -e RUSTFLAGS=-Ctarget-feature=+crt-static \
            "$image" \
            cargo build --locked --release --target ${{ matrix.target }} -p podssh-cli
      - name: the binary is static
        run: |
          set -eu
          B=target/${{ matrix.target }}/release/podssh
          if readelf -d "$B" | grep -q NEEDED; then echo "dynamic dependencies:"; readelf -d "$B"; exit 1; fi
          if readelf -l "$B" | grep -q INTERP; then echo "asks for a program interpreter"; exit 1; fi
          file "$B"
          "$B" --version
      # The binary prints the version of Cargo.toml, and a tag names it.
      - name: the version of the binary
        run: |
          set -eu
          want=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          case "$GITHUB_REF" in
            refs/tags/v*) test "$GITHUB_REF_NAME" = "v$want" || { echo "the tag $GITHUB_REF_NAME is not v$want"; exit 1; } ;;
          esac
          got=$(target/${{ matrix.target }}/release/podssh --version)
          test "$got" = "podssh $want" || { echo "the binary prints \"$got\", not \"podssh $want\""; exit 1; }
      - name: package
        run: |
          set -eu
          mkdir -p dist
          cp target/${{ matrix.target }}/release/podssh dist/podssh-${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: podssh-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  windows:
    name: windows x86_64
    runs-on: windows-2025
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 4
      RUSTFLAGS: -Ctarget-feature=+crt-static
    steps:
      - uses: actions/checkout@v7
      # aws-lc's build needs NASM on Windows x86-64: with no NASM it stops,
      # unless AWS_LC_SYS_PREBUILT_NASM=1 asks for its prebuilt objects
      # (aws-lc-sys 0.45, builder/main.rs). The release assembles them itself.
      - uses: ilammy/setup-nasm@v1
      - name: build
        run: cargo build --locked --release -p podssh-cli
      - name: package
        shell: bash
        run: |
          set -eu
          mkdir -p dist
          cp target/release/podssh.exe dist/podssh-x86_64-pc-windows-msvc.exe
          # The checkout can hold CRLF line ends.
          want=$(tr -d '\r' < Cargo.toml | sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p')
          got=$(dist/podssh-x86_64-pc-windows-msvc.exe --version | tr -d '\r')
          test "$got" = "podssh $want" || { echo "the binary prints \"$got\", not \"podssh $want\""; exit 1; }
      - name: the binary needs no C runtime DLL
        shell: pwsh
        run: |
          # dumpbin ships with the runner's Visual Studio, off PATH; vswhere,
          # installed with it, finds it.
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $dumpbin = & $vswhere -latest -products * -find "VC\Tools\MSVC\**\bin\Hostx64\x64\dumpbin.exe" |
            Select-Object -First 1
          if (-not $dumpbin) { Write-Error "dumpbin was not found"; exit 1 }
          $deps = & $dumpbin /dependents dist\podssh-x86_64-pc-windows-msvc.exe | Out-String
          Write-Output $deps
          if ($LASTEXITCODE -ne 0) { Write-Error "dumpbin failed"; exit 1 }
          if ($deps -match '(?i)vcruntime|msvcp|ucrtbase|api-ms-win-crt') {
            Write-Error "the binary links a C runtime DLL"
            exit 1
          }
      - uses: actions/upload-artifact@v7
        with:
          name: podssh-x86_64-pc-windows-msvc
          path: dist/*
          if-no-files-found: error

  # On a tag it publishes. Run by hand, each step but the last runs, and the
  # files and the body are an artifact: the steps of a release are proved
  # before its tag, which never moves.
  publish:
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # git-cliff reads the commits since the previous tag.
          fetch-depth: 0
      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: podssh-*
          merge-multiple: true
      # The licenses of the crates in the binaries, with their texts: the
      # notices that Apache-2.0 and the BSD licenses ask a binary to carry.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - name: the notices of the third-party licenses
        run: |
          set -eu
          cargo about generate --manifest-path crates/podssh-cli/Cargo.toml --locked -c about.toml about.hbs \
            -o dist/THIRD-PARTY-LICENSES.md
          test -s dist/THIRD-PARTY-LICENSES.md
      - name: checksums
        run: |
          set -eu
          cd dist
          sha256sum podssh-* > SHA256SUMS
          cat SHA256SUMS
      # A release binary of git-cliff, checked against its checksum: no
      # crate is built in the job that publishes.
      - uses: taiki-e/install-action@v2
        with:
          tool: git-cliff@2.9.1
      # The commits of this release, each one, from cliff.toml.
      - name: the list of the commits (git-cliff, pinned)
        run: |
          set -eu
          git cliff --config cliff.toml --latest --strip all > "$RUNNER_TEMP/changes.md"
          test -s "$RUNNER_TEMP/changes.md"
      # The tag, or by hand the tag of Cargo.toml's version: they must agree.
      - name: the tag
        run: |
          set -eu
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)
          case "$GITHUB_REF" in
            refs/tags/v*) tag=$GITHUB_REF_NAME ;;
            *) tag="v$version" ;;
          esac
          test "$tag" = "v$version" || { echo "the tag $tag is not v$version, the version of Cargo.toml"; exit 1; }
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - name: the body of the release
        run: |
          set -eu
          notes="docs/releases/$TAG.md"
          if [ ! -f "$notes" ]; then echo "missing release notes: $notes"; exit 1; fi
          {
            cat "$notes"
            printf '\nThe licenses of the crates in the binaries, with their texts: THIRD-PARTY-LICENSES.md.\n'
            printf '\n## The commits of this release\n\n'
          } > "$RUNNER_TEMP/body.md"
          # GitHub refuses a body of more than 125,000 characters. A character
          # is at least one byte, so a count of bytes errs on the safe side.
          budget=$((120000 - $(wc -c < "$RUNNER_TEMP/body.md")))
          if [ "$(wc -c < "$RUNNER_TEMP/changes.md")" -le "$budget" ]; then
            cat "$RUNNER_TEMP/changes.md" >> "$RUNNER_TEMP/body.md"
          else
            # After the checksums: CHANGES.md is not a binary.
            cp "$RUNNER_TEMP/changes.md" dist/CHANGES.md
            printf 'The list is cut; CHANGES.md, among the files, holds each commit.\n\n' >> "$RUNNER_TEMP/body.md"
            head -c "$((budget - 200))" "$RUNNER_TEMP/changes.md" | sed '$d' >> "$RUNNER_TEMP/body.md"
          fi
          size=$(wc -c < "$RUNNER_TEMP/body.md")
          echo "the body: $size bytes; the list: $(grep -c '^- ' "$RUNNER_TEMP/changes.md" || true) commits"
          test "$size" -lt 125000
      - name: publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" $pre --verify-tag --title "podssh $TAG" --notes-file "$RUNNER_TEMP/body.md" dist/*
      - name: the files and the body that a tag would publish
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: cp "$RUNNER_TEMP/body.md" dist/BODY.md
      - if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: release-dry-run
          path: dist/*
          if-no-files-found: error
