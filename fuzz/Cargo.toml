[package]
name = "podssh-fuzz"
description = "The fuzz targets of podssh's parsers (T-198), for cargo-fuzz and libFuzzer."
version = "0.0.0"
edition = "2021"
license = "0BSD"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace: the root workspace excludes this directory, so the gate
# builds nothing of it, and libFuzzer's C++ stays out of the library crates.
[workspace]
members = ["."]

[dependencies]
libfuzzer-sys = "0.4"
podssh-ws = { path = "../crates/podssh-ws" }
podssh-relay = { path = "../crates/podssh-relay" }
podssh-ssh = { path = "../crates/podssh-ssh" }
podssh-core = { path = "../crates/podssh-core" }
podssh-cli = { path = "../crates/podssh-cli" }

# A crash names its line.
[profile.release]
debug = 1

[[bin]]
name = "ws_frame"
path = "fuzz_targets/ws_frame.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http_head"
