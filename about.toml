# cargo-about: the licenses of the crates that a release binary of podssh
# includes, with their texts, for the file of notices that each release
# publishes beside the binaries (THIRD-PARTY-LICENSES.md, made by the job
# publish of .github/workflows/release.yml from about.hbs). The licenses are
# those that deny.toml allows.
accepted = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "Unicode-3.0",
  "Zlib",
]
# The binary's graph only: a crate of the tests ships in no binary.
ignore-dev-dependencies = true
