# git-cliff: the list of the commits since the last tag, for the body of a
# release (docs/development.md, "Release builds"). Each commit is kept: no
# parser skips one, and a subject need not be a Conventional Commit. The
# groups follow the subjects of this repository; "Other" takes the rest.
# A subject is cut to 200 characters: the first lines of this history hold
# about 112,000, and GitHub refuses a release body of more than 125,000.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {{ commit.message | split(pat="\n") | first | trim | truncate(length=200) }} ({{ commit.id | truncate(length=7, end="") }})
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true
# After the cut, so that no link is cut in two. A name after `@` becomes
# code, so that a release notifies nobody (the subjects hold @NAME and
# @GROUP); an issue named as #N links to it.
postprocessors = [
  { pattern = '(?m)(^|[^A-Za-z0-9_`])@([A-Za-z0-9][A-Za-z0-9-]*)', replace = "${1}`@${2}`" },
  { pattern = '#([0-9]+)', replace = "[#${1}](https://github.com/Azathothas/podssh/issues/${1})" },
]

[git]
conventional_commits = false
filter_unconventional = false
split_commits = false
# The comment before each group's name only orders the groups.
commit_parsers = [
  { message = '^podssh [a-z-]+:', group = "<!-- 0 -->Commands" },
  { message = '^(gate|Workflows|CI)\b|^scripts/', group = "<!-- 1 -->Build and CI" },
  { message = '^[Dd]ocs\b', group = "<!-- 2 -->Documents" },
  { message = '^Fix', group = "<!-- 3 -->Repairs" },
  { message = '.', group = "<!-- 4 -->Other" },
]
filter_commits = false
tag_pattern = 'v[0-9].*'
sort_commits = "oldest"
