[package]
name = "podssh-ts"
version.workspace = true
edition.workspace = true
# The vendored tailscale-rs fork declares rust-version 1.92.0.
rust-version = "1.92"
license.workspace = true
publish.workspace = true

[dependencies]
# The proxy as each podssh command reads it: its URL, the variables and
# their order (T-103).
podssh-ws = { path = "../podssh-ws" }
tokio.workspace = true
zeroize.workspace = true
tailscale = { path = "../../vendor/tailscale-rs" }
ts_runtime = { path = "../../vendor/tailscale-rs/ts_runtime" }
ts_http_util = { path = "../../vendor/tailscale-rs/ts_http_util" }

[dev-dependencies]
# `test-util` gives the tests a paused clock: a wait for a network map that
# never comes ends at its limit with no real seconds spent.
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
# The fork's DERP dial over WebSocket, tested through a stand-in proxy here,
# where podssh's workspace builds it (T-103).
ts_derp = { path = "../../vendor/tailscale-rs/ts_derp" }
