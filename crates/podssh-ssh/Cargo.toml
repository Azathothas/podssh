[package]
name = "podssh-ssh"
description = "The native SSH client behind `podssh ssh`: russh over a relay or TCP stream, with podssh's host-key, authentication and terminal handling."
version.workspace = true
edition.workspace = true
# russh 0.64.1 declares 1.89 (read from its Cargo.toml); the library crates
# keep the workspace minimum.
rust-version = "1.89"
license.workspace = true
publish.workspace = true

# This crate needs a C compiler: russh's crypto backend is aws-lc-rs
# (aws-lc-sys). Operator decision 2026-10-08; the no-C rule covers the
# library crates below it, not this one. `default-features = false` keeps the
# backend choice explicit: `aws-lc-rs`, plus RSA keys and zlib compression
# (flate2's default backend is pure Rust).
[dependencies]
russh = { version = "0.64.1", default-features = false, features = ["aws-lc-rs", "rsa", "flate2"] }
podssh-ws = { path = "../podssh-ws" }
# fs: a descriptor that a control client passes and epoll does not take
# (a regular file) is read and written on tokio's blocking threads (T-039).
tokio = { workspace = true, features = ["signal", "process", "fs"] }
zeroize = { workspace = true }
base64 = { workspace = true }
hmac = { workspace = true }
sha1 = { version = "0.10.7", default-features = false }
# Key generation (`podssh keygen`): the thread generator russh itself uses for
# keys, seeded from the operating system; the same version and features as
# russh's own, so nothing new is compiled.
rand = { version = "0.10", features = ["thread_rng"] }
# SFTP version 3 (T-133): pure Rust, Apache-2.0, a limit on each request, and
# requests in flight together. Its one optional feature (async-trait) is off.
russh-sftp = { version = "3.0.1", default-features = false }
# The channels of -L and -D open at the same time (T-038): the version that
# russh pulls in, so nothing new is compiled.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# RSA signatures and RSA keys through aws-lc-rs, whose RSA is constant-time
# (T-257); the `rsa` crate's private-key operations are not
# (RUSTSEC-2023-0071). The version and features that russh pulls in.
aws-lc-rs = "1.16.2"
# The CRT exponents of an OpenSSH RSA key, d mod (p - 1) and d mod (q - 1),
# in constant time, for its PKCS#1 form (T-257). The features that `rsa`
# asks for, so nothing new is compiled.
crypto-bigint = { version = "0.7.3", default-features = false, features = ["alloc", "zeroize"] }

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
] }
# Whether Pageant runs (T-228): russh's stream to Pageant opens when none
# does, and closes at the first request. The version that russh pulls in, so
# nothing new is compiled.
pageant = { version = "0.2.4", default-features = false, features = ["wmmessage"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "signal", "process"] }

# cargo-fuzz builds with `--cfg fuzzing` (`fuzz/`), under which the parser of
# a known_hosts line, private here, is reachable by the fuzzer.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
