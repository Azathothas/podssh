[package]
name = "podssh-iroh"
description = "The iroh road between two podssh ends: QUIC between keys, through a relay when UDP is refused."
version.workspace = true
edition.workspace = true
# iroh 1.4.1 declares 1.91, as 1.3.0 did (read from its Cargo.toml).
rust-version = "1.91"
license.workspace = true
publish.workspace = true

# A crate of its own, outside the crates with no C: iroh with aws-lc-rs needs
# a C compiler, as russh does for the binary (AGENTS.md, section 5, rule 4).
# Not a default member: a build without the feature `iroh` of podssh-cli does
# not compile it.
[dependencies]
# 1.1 or later: three advisories of 2026-10-05 affect each release up to
# 1.0.3. No default features: no ring (aws-lc-rs, as russh), no port mapping
# (UPnP and NAT-PMP need UDP and a router), no metrics, no macOS fast path.
# Its iroh-relay is the copy in vendor/ with podssh's patch, which dials the
# relay through a SOCKS5 proxy too (T-280; the root's [patch.crates-io]).
# `unstable-net-report`: the endpoint's report of the network, whose QUIC
# address discovery says that a datagram came back (T-359). iroh keeps that
# API out of its semver, so the range ends before 1.5: a new minor version
# comes as an update to read, not as a build that breaks.
iroh = { version = ">=1.4.1, <1.5", default-features = false, features = ["tls-aws-lc-rs", "unstable-net-report"] }
podssh-relay = { path = "../podssh-relay" }
podssh-ws = { path = "../podssh-ws" }
tokio = { workspace = true }
# The types of iroh's interfaces: the relay's certificate verifier (rustls),
# the proxy's URL (url), and the resolver's errors (n0-error), at the
# versions that iroh already builds.
rustls = { workspace = true }
url = "2"
n0-error = "1"
# The stream of a connection's paths, for the line that says which carried
# a session (T-335): the version that iroh already builds.
n0-future = "0.3"
# The check of the proxy's credentials against iroh's encoding of them.
base64 = { workspace = true }
# A node's address as iroh's own tools write it (T-163); the version of
# iroh's own crates.
iroh-tickets = "1"
# A node's record of pkarr as iroh writes and reads it, its signature checked
# (T-350): the iroh-dns that iroh builds, in iroh's range, so no crate is
# added and the two move together.
iroh-dns = { version = ">=1.4.1, <1.5", default-features = false }
# The versions of iroh's relay protocol, which the question of a refused
# version offers (T-348), and, with the feature `test-relay` only, iroh's
# relay server: the iroh-relay that iroh builds, so no crate is added.
iroh-relay = { version = "1", default-features = false }
# A certificate under any name, for the feature `test-relay` only.
rcgen = { version = "0.14", optional = true }
# The TLS of the stand-in server of pkarr, for the feature `test-relay` only
# (T-350): the tokio-rustls that podssh-ws builds.
tokio-rustls = { workspace = true, optional = true }

[features]
# A relay server and a server of pkarr on the loopback for the tests of this
# crate and of the command line (`podssh-cli`'s feature `iroh-test`); never
# in a release.
test-relay = [
  "iroh/test-utils",
  "iroh-relay/server",
  "iroh-relay/test-utils",
  "dep:rcgen",
  "rustls/ring",
  "dep:tokio-rustls",
]

[dev-dependencies]
# A relay server on the loopback, and the skip of its certificate check, for
# the tests only.
iroh = { version = ">=1.4.1, <1.5", default-features = false, features = ["tls-aws-lc-rs", "test-utils"] }
# This crate with its test relay, for its own tests.
podssh-iroh = { path = ".", features = ["test-relay"] }
sha2 = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
