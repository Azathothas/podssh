[package]
name = "podssh-todo"
description = "The checker of the work record in TODO/: a reader that the gate runs, and a writer that moves a status, derives the counts and moves the citations of an edited file."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# The checker of the record is pod-todo of PodUtils/podcrates; the facts of
# podssh are in TODO/todo.toml.
[dependencies]
pod-todo = { git = "https://github.com/PodUtils/podcrates", tag = "v0.4.0" }
