[package]
name = "podssh-ws"
description = "WebSocket framing over a TLS stream, with the TLS and the pure-Rust crypto provider of pod-tls."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# TLS: the trust, the configurations, the pure-Rust crypto provider, the
# server's side and Encrypted Client Hello, with podssh's settings (tls.rs).
pod-core = { git = "https://github.com/PodUtils/podcrates", tag = "v0.5.0" }
pod-tls = { git = "https://github.com/PodUtils/podcrates", tag = "v0.5.0", features = ["pure", "rsa", "ech"] }
# The dial, the proxies, the race of addresses, Multipath TCP, the HTTP/1.1
# heads, the GET client (sealed with ECH where asked) and STUN's codec, with
# podssh's settings (dial.rs).
pod-proxy = { git = "https://github.com/PodUtils/podcrates", tag = "v0.5.0", features = ["ech"] }
# The resolver: an IP literal, the pins, the system, the cache of addresses
# and DNS over HTTPS, the SRV and HTTPS records (resolve.rs), with its reader
# of ECH lists for pod-tls.
pod-dns = { git = "https://github.com/PodUtils/podcrates", tag = "v0.5.0", features = ["ech"] }
# The services of other parties: the forwarders of `--via` (forwarder/builtin.rs).
pod-services = { git = "https://github.com/PodUtils/podcrates", tag = "v0.5.0" }
tokio = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
base64 = { workspace = true }
zeroize = { workspace = true }
# HTTP/2 for the roads of VLESS (vless/xhttp.rs) and of an HTTP/2 relay
# (h2_road/): h2 and its types, pure Rust, in the lock already through the
# quick tunnel of podssh-relay.
h2 = "0.4.19"
http = "1.5"
bytes = "1.12"
# The tokens of wstunnel and the answers of a forwarder are JSON.
serde_json = { workspace = true }
# Shadowsocks (T-373): its master key is OpenSSL's EVP_BytesToKey with MD5,
# and each stream's key HKDF-SHA1 of it, with the HKDF above. Both pure
# Rust, and both in the lock already: md5 0.8 through podssh-ssh, sha1 0.11
# (digest 0.11, as hkdf 0.13 takes it, T-386) through podssh-ssh and russh.
# No `asm` of sha1, which would compile assembly.
md5 = { version = "0.8", default-features = false }
sha1 = { version = "0.11", default-features = false }
# Shadowsocks 2022 (T-492): each stream's key is BLAKE3's derive_key, once
# for each stream, so its SIMD buys nothing: `pure` builds no C and no
# assembly, and the default build compiles as before. The lock holds 1.8.7
# already, through iroh.
blake3 = { version = "1.8.7", default-features = false, features = ["std", "pure"] }
# frp's control stream (T-498): AES-128 in CFB mode with a key of
# PBKDF2-HMAC-SHA1 (frp/cfb.rs, with the HMAC and SHA-1 above). The block
# cipher alone, pure Rust, in the lock already through podssh-ssh.
aes = { workspace = true }

# The clocks of a host that slept (wake.rs): CLOCK_BOOTTIME beside
# CLOCK_MONOTONIC, which Linux alone has. libc compiles no C.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[features]
# A plain WebSocket over TCP to the loopback, for the tests of an embedder
# (podvm) and a stand-in relay (T-068). Off by default; the binary never
# enables it, and the gate checks that with `cargo tree`.
plain-ws = []

[dev-dependencies]
pod-testkit = { git = "https://github.com/PodUtils/podcrates", tag = "v0.5.0", features = ["screen"] }
# The doctor is async because it may be asked to perform a handshake, and
# the plants that assert `????` rather than `ok` have to drive it as a caller
# would. `macros` is what makes `#[tokio::test]` exist.
tokio = { workspace = true, features = ["macros", "rt"] }
# The live handshake test drives the same `tokio-rustls` connector the
# library uses, rather than re-deriving one, so what is proven is what ships.
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
# The certificates of the tests are minted on P-256, in pure Rust.
# `default-features = false`, as in the workspace: nothing may pull in a C
# toolchain. `getrandom` (the OS's source, no C) gives the tests a secret of
# p256's own `Generate`, which the curves' 0.14 take in place of a rand
# generator; the library draws from rustls's source alone.
p256 = { workspace = true, features = ["getrandom"] }
# The far end of a Shadowsocks server, sealed with the AEADs of the
# specification itself (tests/shadowsocks.rs).
aes-gcm = { workspace = true }
chacha20poly1305 = { workspace = true }
# The terminal oracle (T-200): a model terminal shows the text that the
# sanitizer leaves, and the cells it takes (tests/terminal_oracle.rs).
vt100 = { workspace = true }
unicode-width = { workspace = true }
# Property tests of frames, fragments and the sanitizer (T-202,
# tests/properties.rs).
proptest = { workspace = true }

# cargo-fuzz builds with `--cfg fuzzing` (`fuzz/`), under which pod-proxy's
# SOCKS5 exchange, private there, is reachable by the fuzzer.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
