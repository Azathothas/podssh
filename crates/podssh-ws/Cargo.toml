[package]
name = "podssh-ws"
description = "WebSocket framing over a TLS stream, and the pure-Rust crypto provider."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
tokio = { workspace = true }
rustls = { workspace = true }
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
webpki-roots = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
aes-gcm = { workspace = true }
chacha20poly1305 = { workspace = true }
x25519-dalek = { workspace = true }
ed25519-dalek = { workspace = true }
p256 = { workspace = true }
p384 = { workspace = true }
rsa = { workspace = true }
rand = { workspace = true }
base64 = { workspace = true }
zeroize = { workspace = true }
# DNS-over-HTTPS answers are JSON (resolve.rs).
serde_json = { workspace = true }

# The socket of Multipath TCP (T-172), which Linux alone makes: the socket
# call with IPPROTO_MPTCP, and getsockopt. libc compiles no C.
[target.'cfg(target_os = "linux")'.dependencies]
libc = { workspace = true }

[features]
# A plain WebSocket over TCP to the loopback, for the tests of an embedder
# (podbox) and a stand-in relay (T-068). Off by default; the binary never
# enables it, and the gate checks that with `cargo tree`.
plain-ws = []

[dev-dependencies]
# The doctor is async because it may be asked to perform a handshake, and
# the plants that assert `????` rather than `ok` have to drive it as a caller
# would. `macros` is what makes `#[tokio::test]` exist.
tokio = { workspace = true, features = ["macros", "rt"] }
# The live handshake test drives the same `tokio-rustls` connector the
# library uses, rather than re-deriving one, so what is proven is what ships.
tokio-rustls = { workspace = true }
rustls-pki-types = { workspace = true }
# The signature tests mint real signatures on real curves, so they need the
# same crates the provider uses. `p256` and `p384` are `default-features =
# false` here for the same reason they are in `[dependencies]`: nothing may
# pull in a C toolchain.
p256 = { workspace = true }
p384 = { workspace = true }
ed25519-dalek = { workspace = true }
# The terminal oracle (T-200): a model terminal shows the text that the
# sanitizer leaves, and the cells it takes (tests/terminal_oracle.rs).
vt100 = { workspace = true }
unicode-width = { workspace = true }
# Property tests of frames, fragments and the sanitizer (T-202,
# tests/properties.rs).
proptest = { workspace = true }

# cargo-fuzz builds with `--cfg fuzzing` (`fuzz/`), under which the SOCKS5
# exchange, private here, is reachable by the fuzzer.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
