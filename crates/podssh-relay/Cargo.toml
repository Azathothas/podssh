[package]
name = "podssh-relay"
description = "Reaching podssh's WebSocket-to-TCP relay: relay hosts and failover, tokens, forward sessions. No C compiler needed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A library other projects (podbox) use, so it stays C-free: the gate builds
# it with CC=/nonexistent with the other library crates.
[dependencies]
podssh-ws = { path = "../podssh-ws" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }
# The resumable layer (src/session/): X25519 gives a new session its secret
# through HKDF-SHA256, and HMAC-SHA256 proves it on a resume. Pure Rust, as
# in podssh-ws.
sha2 = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
x25519-dalek = { workspace = true }
# The identity of each end (src/identity/, T-087): an Ed25519 key, shown by
# its SHA256 fingerprint in base64 as OpenSSH shows one. Pure Rust.
ed25519-dalek = { workspace = true, features = ["zeroize"] }
base64 = { workspace = true }
# The channel between two podssh ends (src/e2e/, T-088): Noise XX, pure Rust.
snow = { workspace = true }

[features]
# Pairs of the reverse road: `POST /v1/pair`, the status of a pair and
# `POST /v1/stop/<name>` (T-078), and the node and operator runners (T-079,
# T-080). No C either; the gate builds it.
pair = []
# A synchronous facade over pairs, the runners and forward sessions, for a
# caller with no async runtime (podbox, T-081). No C either; the gate builds it.
blocking = ["pair"]
# Plain ws:// to a stand-in relay on the loopback, for the tests of an embedder
# (T-068). The binary never enables it (scripts/no-plain-ws.sh).
plain-ws = ["podssh-ws/plain-ws"]

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# The owner and the access list of a private file, and the files and
# directories that podssh makes with an access list of their own (T-274).
# Bindings with no C code (windows-link's raw-dylib), the version that tokio
# pulls in.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Threading",
] }

[dev-dependencies]
# `test-util` gives the tests a paused clock: the heartbeat's 200 s of idle
# time pass at once (T-154).
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
# Property tests of relay lists and paths (T-202, tests/properties.rs).
proptest = { workspace = true }
