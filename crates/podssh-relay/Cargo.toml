[package]
name = "podssh-relay"
description = "Reaching podssh's WebSocket-to-TCP relay: relay hosts and failover, tokens, forward sessions. No C compiler needed."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A library other projects (podbox) use, so it stays C-free: the gate builds
# it with CC=/nonexistent with the other library crates.
[dependencies]
podssh-ws = { path = "../podssh-ws" }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
zeroize = { workspace = true }
rand = { workspace = true }
# The resumable layer (src/session/): X25519 gives a new session its secret
# through HKDF-SHA256, and HMAC-SHA256 proves it on a resume. Pure Rust, as
# in podssh-ws.
sha2 = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
x25519-dalek = { workspace = true }

[features]
# Pairs of the reverse road: `POST /v1/pair`, the status of a pair and
# `POST /v1/stop/<name>` (T-078), and the node and operator runners (T-079,
# T-080). No C either; the gate builds it.
pair = []
# A synchronous facade over pairs, the runners and forward sessions, for a
# caller with no async runtime (podbox, T-081). No C either; the gate builds it.
blocking = ["pair"]
# Plain ws:// to a stand-in relay on the loopback, for the tests of an embedder
# (T-068). The binary never enables it (scripts/no-plain-ws.sh).
plain-ws = ["podssh-ws/plain-ws"]

[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
# `test-util` gives the tests a paused clock: the heartbeat's 200 s of idle
# time pass at once (T-154).
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
