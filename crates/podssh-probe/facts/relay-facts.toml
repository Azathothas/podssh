origin = "https://tcp.ssh.relay.ajam.dev"

# The pin. This is what the live document is compared against, and it moves.
# NEVER re-pin silently: when the live version changes, read the diff, then
# update this file and docs/relay.md in the same change.
[pin]
version = "2026-10-03-r2"
spec-sha256 = "88eb1b0b8571b829daab17614ea2e27966ba5611951ea28db84660fc41cfa5a8"
spec-lines = 246
spec-bytes = 18359
measured-on = "2026-10-04"
measured-how = "curl -sSL https://tcp.ssh.relay.ajam.dev/llms-full.txt | tee /tmp/llms.txt | wc -lc ; sha256sum /tmp/llms.txt ; curl -sSL https://tcp.ssh.relay.ajam.dev/health | grep -o version"

# The relay's cap on a forward frame, compiled in: podssh-core reads it here
# when it compiles, and podssh-ws holds the same number as its forward cap. A
# session takes the relay's own `max_frame_bytes` from its cached /relays.json
# when it is larger, never more than 16 MiB, and a cached value can only widen
# what podssh takes in and narrow what it spends (T-342).
# scripts/check-relay-limits.py compares the live /relays.json with
# relay-limits.toml, which holds this one with the other limits. Re-measured
# 2026-10-31 from https://tcp.ssh.relay.ajam.dev/relays.json?host=github.com&port=22
forward-max-frame-bytes = 262144

# ── Structural facts ────────────────────────────────────────────────────────
# Each is ONE line of the peer's document, and the value that line must carry.
# Nothing else about the peer's prose is asserted. `line` is a hint: the fact
# is read there first, then on each line of its `section`, the heading of the
# document that it stands under, named by the heading's first words (T-338).
# Found at another line of its section, it holds, with a note to move the
# hint; found nowhere in its section, it fails.

[[facts]]
id = "reverse-node-path"
line = 23
section = "Exact addresses"
contains = "/v1/node/<name>"
why = "The node dials out to this path. A renamed path sends every outbound-only node nowhere."

[[facts]]
id = "reverse-operator-path"
line = 24
section = "Exact addresses"
contains = "/v1/connect/<name>"
why = "The operator dials this path. A renamed path silently ends the reverse pair."

[[facts]]
id = "binary-frames-required"
line = 210
section = "Protocol (for other clients)"
contains = "**binary** frames carry raw TCP bytes verbatim"
why = "After 101 the relay copies BINARY frame payload into the TCP stream. A client that sends text injects the peer's prose into an SSH session."

[[facts]]
id = "no-subprotocol"
line = 207
section = "Protocol (for other clients)"
contains = "no subprotocol"
why = "Offering a subprotocol the relay does not accept can produce a handshake failure that looks like a network problem."

[[facts]]
id = "node-open-timeout"
line = 190
section = "Reverse close codes"
pattern = "No `ready` within (\\d+) s of `open`"
value = 15
why = "A node that does not answer `open` with `ready` inside this window has its operator reaped. The value is the protocol, not a tuning knob."

[[facts]]
id = "bad-multiplex-frame-is-1009"
line = 182
section = "Reverse close codes"
contains = "| 1009 | bad multiplex frame | node |"
why = "A node binary frame under 32 bytes or over 65568 closes the node 1009. Confining the 32-byte id prefix and the payload to ONE frame is what avoids it."

# ── Relations between two published numbers ─────────────────────────────────
# Asserted as arithmetic rather than as two literals, so a peer rewording
# either sentence does not redden the gate while a peer changing either number
# does. The expression names its operands, so the check reads as the arithmetic
# it performs.

[[relations]]
id = "reverse-node-frame-cap"
expression = "id + payload == cap"
why = "A node frame is 32 bytes of id plus up to 65536 bytes of payload, and the relay refuses it over 65568. Sending the id and the payload as two frames closes the node 1009 instead."
# BOTH operands come from line 182, and that is the whole reason this
# relation exists rather than two literal facts. An earlier version took the
# cap from line 184, which states a DIFFERENT limit: 65536 is the OPERATOR
# frame's payload cap, and 32 + 65536 != 65536. The relation then reported the
# relay contradicting itself while comparing two numbers that were never
# related. One sentence, two numbers, one arithmetic fact.
[relations.src]
line = 182
section = "Reverse close codes"
pattern = "over (\\d+) \\(32-byte id plus (\\d+) payload\\)"
names = ["cap", "payload"]

[relations.dst]
line = 182
section = "Reverse close codes"
pattern = "over (\\d+) \\(32-byte id plus (\\d+) payload\\)"
names = ["cap"]

# Line 182 has exactly ONE parenthetical bound. Its prose is
#   "over 65568 (32-byte id plus 65536 payload)": the 65568 comes BEFORE the '('
#   and only the 65536 falls inside it. The first version of the Python half
#   of this gate read group 1 as the id length and computed `65568 + 65536`,
#   which reported the relay contradicting itself when the relay is consistent.
#   Group 1 is the TOTAL cap and group 2 is the payload. Verify a citation with
#   `sed -n 'Np'`; do not read it out of the number you expect.