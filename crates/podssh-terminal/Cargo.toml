[package]
name = "podssh-terminal"
description = "The userspace line discipline, for a host with no pty."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
unicode-width = { workspace = true }

[dev-dependencies]
# The terminal oracle (T-200): a model terminal reads what the discipline
# writes, and the tests compare its screens (tests/screen/).
vt100 = { workspace = true }
# Property tests of the line discipline (T-202, tests/properties.rs).
proptest = { workspace = true }
