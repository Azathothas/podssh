# An inventory in Ansible's INI form (T-047), read by Ansible's own
# ansible-inventory and ansible, and by podssh config import. The secrets
# are not real; no test may find them on stdout or stderr.
mail.example.org
jumper ansible_port=5555 ansible_host=192.0.2.50

[webservers]
web1.example.org ansible_user=deploy
web2.example.org:2222
www[01:03].example.org
foo.example.org ansible_password=not-a-real-secret-1

[webservers:vars]
ansible_port=2200
ansible_ssh_private_key_file=~/.ssh/web_ed25519

[dbservers]
db-[a:c].example.org
db-legacy.example.org ansible_ssh_host=192.0.2.60 ansible_ssh_user=legacy ansible_ssh_port=2022

[dbservers:vars]
ansible_user="dba"
ansible_become_password=not-a-real-secret-2

[windows]
win1.example.org ansible_connection=winrm ansible_user=Administrator

[edge]
node[1:5:2].example.org ansible_ssh_common_args='-o ProxyJump=bastion.example.org'

[prod:children]
webservers
dbservers

[prod:vars]
ansible_user=produser
ansible_port=2201

[all:vars]
ansible_user=admin
ansible_ssh_pass=not-a-real-secret-3
