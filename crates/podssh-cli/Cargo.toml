[package]
name = "podssh-cli"
description = "Argument parsing, subcommand dispatch, the doctor command."
version.workspace = true
edition.workspace = true
# russh 0.64.1 declares 1.89 (read from its Cargo.toml); the library crates
# keep the workspace minimum.
rust-version = "1.89"
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "podssh"
path = "src/main.rs"

[lib]
name = "podssh_cli"
path = "src/lib.rs"

[features]
default = []
# `podssh ts`: the Tailscale adapter over the vendored tailscale-rs fork.
# Off by default because the fork needs a C compiler and cmake (aws-lc-sys)
# and dominates build time, memory and binary size. Without it, `podssh ts`
# still parses and refuses with a message naming this feature.
ts = ["dep:podssh-ts"]

# Each dependency is one that the library uses: `unused_crate_dependencies`
# is denied in src/lib.rs, so a dependency that no code uses fails the build.
[dependencies]
podssh-probe = { path = "../podssh-probe" }
podssh-ts = { path = "../podssh-ts", optional = true }
podssh-ws = { path = "../podssh-ws" }
# Relay hosts and failover, tokens, forward sessions (C-free, shared with podbox).
podssh-relay = { path = "../podssh-relay", features = ["pair"] }
# The native SSH client. It needs a C compiler (russh with aws-lc-rs); the
# operator accepted that for the binary on 2026-10-08.
podssh-ssh = { path = "../podssh-ssh" }
# `signal`: `podssh node` stops on Ctrl-C and SIGTERM.
tokio = { workspace = true, features = ["signal"] }
serde_json = { workspace = true }
# %C of the ssh_config tokens is SHA-1, as OpenSSH computes it; the version
# podssh-ssh already builds.
sha1 = { version = "0.10.7", default-features = false }
# `cp` compares the SHA-256 of both ends (T-134); the version the workspace
# already builds.
sha2 = { workspace = true }
# The random part of `cp`'s temporary names: the same version and features as
# podssh-ssh's, so nothing new is compiled.
rand = { version = "0.10", features = ["thread_rng"] }

# The relay token is wiped from memory when dropped.
zeroize = { workspace = true }

# MEASURED 2026-10-02, this machine (Git Bash on Windows) and in
# `rust:1-alpine` via `sh scripts/dev.sh run`:
#   curl -sS 'https://crates.io/api/v1/crates/clap'            -> max_version 4.6.7
#   curl -sS 'https://index.crates.io/cl/ap/clap'              -> 4.6.7, rust_version 1.85
#   CC=/nonexistent cargo build -p podssh-cli                  -> exit 0
# `suggestions` is ON and it is the reason for the dependency: it is what pulls
# `strsim` in, and `strsim` is a Damerau-Levenshtein implementation. A hand-rolled
# edit distance was measured to be wrong for `example.org`; this is
# the library doing it instead.
#
# `wrap_help` is OFF on purpose. It pulls `terminal_size`, which is a
# terminal probe — and `AGENTS.md` (section 5, rule 1) forbids depending on a capability
# that has not been probed. Podssh renders `--help` at a fixed 100 columns, which is what
# makes the man/help parity check a string comparison rather than a guess.
clap = { version = "4.6.7", default-features = false, features = [
  "std", "help", "usage", "error-context", "suggestions", "derive",
] }

# The calls into the C library are in code for Unix only (the probes of
# doctor, the ids of the ssh_config tokens).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# The live IRC example only.
[dev-dependencies]
podssh-core = { path = "../podssh-core" }
