[package]
name = "podssh-cli"
description = "Argument parsing, subcommand dispatch, the doctor command."
version.workspace = true
edition.workspace = true
# russh 0.65.0 declares 1.89 (read from its Cargo.toml); the library crates
# keep the workspace minimum.
rust-version = "1.89"
license.workspace = true
publish.workspace = true
repository.workspace = true

[[bin]]
name = "podssh"
path = "src/main.rs"

[lib]
name = "podssh_cli"
path = "src/lib.rs"

[features]
default = []
# `podssh ts`: the Tailscale adapter over the vendored tailscale-rs fork.
# Off by default because the fork needs a C compiler and cmake (aws-lc-sys)
# and dominates build time, memory and binary size. Without it, `podssh ts`
# still parses and refuses with a message naming this feature.
ts = ["dep:podssh-ts"]
# The iroh road between two podssh ends (T-162). Off by default: iroh adds
# about 200 crates, needs Rust 1.91 and a C compiler (aws-lc-rs, as russh),
# and the road is one that the user selects.
iroh = ["dep:podssh-iroh", "dep:iroh"]
# The iroh road with a relay server on the loopback, for the test of the
# command line from end to end (`tests/iroh_road.rs`); never in a release.
iroh-test = ["iroh", "podssh-iroh/test-relay"]
# WARP's MASQUE road over HTTP/2 (T-352, the operator's ruling Q52):
# `warp://HOST[:PORT]`. Off by default, as a trial: pure Rust, but smoltcp
# needs Rust 1.91, and the road waits for its live run (T-352's Prove).
# Without it, a warp:// destination is refused with exit 70. With it, the
# quick tunnel's node reaches the edge inside WARP's tunnel too (T-374).
warp = ["dep:podssh-warp", "podssh-relay/warp"]
# Tor through Arti (T-353, the operator's ruling Q52): `tor://HOST[:PORT]`.
# Off by default: Arti adds about 500 crates, SQLite's C and Rust 1.92, and
# its live test waits for Q60. Without it, a tor:// destination is refused
# with exit 70.
tor = ["dep:podssh-tor"]

# Each dependency is one that the library uses: `unused_crate_dependencies`
# is denied in src/lib.rs, so a dependency that no code uses fails the build.
[dependencies]
podssh-probe = { path = "../podssh-probe" }
podssh-ts = { path = "../podssh-ts", optional = true }
podssh-iroh = { path = "../podssh-iroh", optional = true }
podssh-warp = { path = "../podssh-warp", optional = true }
podssh-tor = { path = "../podssh-tor", optional = true }
# The type of a relay's URL, for `doctor`'s line; the version that
# podssh-iroh builds, and its range (T-359).
iroh = { version = ">=1.4.1, <1.5", default-features = false, features = ["tls-aws-lc-rs"], optional = true }
podssh-ws = { path = "../podssh-ws" }
# The leaf of a release's Sigstore bundle, read (T-375): no C, as its
# feature `verify` (ring) is off; the signatures are podssh-ws's own.
x509-parser = { version = "0.18", default-features = false }
# The trait of podssh-ws's signature checks, for that bundle.
rustls = { workspace = true }
# Relay hosts and failover, tokens, forward sessions (C-free, shared with podbox).
# `derp`: the DERP road of `podssh node --derp` and `podssh ssh derp:` (T-379),
# pure Rust, in each build, as the operator's ruling Q50 makes it a fallback.
podssh-relay = { path = "../podssh-relay", features = ["pair", "quick", "derp"] }
# The native SSH client. It needs a C compiler (russh with aws-lc-rs); the
# operator accepted that for the binary on 2026-10-08.
podssh-ssh = { path = "../podssh-ssh" }
# The JWT of a service account's key for IAP (T-351), signed RS256 in
# aws-lc-rs, whose RSA is constant-time, never with the `rsa` crate
# (RUSTSEC-2023-0071): the version and features that podssh-ssh builds, so
# nothing new is compiled.
aws-lc-rs = "1.16.2"
# `signal`: `podssh node` stops on Ctrl-C and SIGTERM.
tokio = { workspace = true, features = ["signal", "process", "fs"] }
serde_json = { workspace = true }
# The protocol of `podssh chat` between two podssh ends (T-099), with no I/O.
podssh-core = { path = "../podssh-core" }
# %C of the ssh_config tokens is SHA-1, as OpenSSH computes it; the version
# podssh-ssh already builds.
sha1 = { version = "0.11", default-features = false }
# `cp` compares the SHA-256 of both ends (T-134); the version the workspace
# already builds.
sha2 = { workspace = true }
# The random part of `cp`'s temporary names: the same version and features as
# podssh-ssh's, so nothing new is compiled.
rand = { version = "0.10", features = ["thread_rng"] }
# The copy by exec carries bytes as base64 where a channel changes them
# (T-135); the version podssh-ssh already builds.
base64 = { workspace = true }

# The relay token is wiped from memory when dropped.
zeroize = { workspace = true }
# The stream of an agent's clients that russh's agent server reads (T-034);
# russh pulls it in already.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
# `podssh session` (T-186): where a kept stream of output may start, and its
# ring (the grammar of T-221), and when the output has stopped.
podssh-terminal = { path = "../podssh-terminal" }
# `podssh session capture`: the screen that a terminal shows after the
# session's output. The model of the terminal oracle (T-200), pure Rust over
# vte, with no build script that compiles C; the lock has it already.
vt100 = { workspace = true }
# `podssh config import mremoteng` (T-327): the XML of mRemoteNG's
# connections, as a read-only tree; pure Rust, whose one dependency
# (memchr) the lock has already (T-292's Decision).
roxmltree = { version = "0.21", default-features = false }

# MEASURED 2026-10-02, this machine (Git Bash on Windows) and in
# `rust:1-alpine` via `sh scripts/dev.sh run`:
#   curl -sS 'https://crates.io/api/v1/crates/clap'            -> max_version 4.6.7
#   curl -sS 'https://index.crates.io/cl/ap/clap'              -> 4.6.7, rust_version 1.85
#   CC=/nonexistent cargo build -p podssh-cli                  -> exit 0
# `suggestions` is ON and it is the reason for the dependency: it is what pulls
# `strsim` in, and `strsim` is a Damerau-Levenshtein implementation. A hand-rolled
# edit distance was measured to be wrong for `example.org`; this is
# the library doing it instead.
#
# `wrap_help` is OFF on purpose. It pulls `terminal_size`, which is a
# terminal probe — and `AGENTS.md` (section 5, rule 1) forbids depending on a capability
# that has not been probed. Podssh renders `--help` at a fixed 100 columns, which is what
# makes the man/help parity check a string comparison rather than a guess.
clap = { version = "4.6.7", default-features = false, features = [
  "std", "help", "usage", "error-context", "suggestions", "derive",
] }

# The calls into the C library are in code for Unix only (the probes of
# doctor, the ids of the ssh_config tokens).
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

# AF_UNIX on Windows for `podssh pipe unix-connect:` (T-176), which the
# standard library has not, the user of a listener's peer (T-177), and a
# file's index, which finds its hard links (T-146): the version and, for the
# file system, the feature that tokio and podssh-ssh build. The standard
# handles of a session daemon that leaves its starter (T-186): the console's
# feature, which podssh-ssh builds.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[dev-dependencies]
# `test-util` gives the tests a paused clock: the limit of a stuck write is
# 60 s (tests/direct_write_limit.rs).
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
# An SSH server for a node's TARGET in `tests/iroh_road.rs`; the version and
# the features that podssh-ssh builds, so no crate is added.
russh = { version = "0.65.0", default-features = false, features = ["aws-lc-rs", "rsa", "flate2"] }
# The terminal oracle (T-200) of `tests/silent_notice.rs` (T-302): the
# model terminal that the tests of podssh-ssh run, so no crate is added.
vt100 = { workspace = true }
# The stand-in release of `tests/update.rs` (T-375): its certificates, of
# its own Fulcio and of its TLS server, made by rcgen with no crypto
# feature and signed by P-256 keys of p256, as podssh-relay's tests make
# theirs, so that no C is compiled; the server's TLS, of tokio-rustls, which
# podssh-ws builds. The lock has each one.
rcgen = { version = "0.14", default-features = false }
p256 = { workspace = true, features = ["getrandom"] }
tokio-rustls = { workspace = true }
# The stand-in DERP server of `tests/derp_road.rs` (T-379), podssh-relay's
# own (`tests/derp_stand_in`), which opens the client's info with NaCl's box:
# the version and features that podssh-relay builds, so no crate is added.
crypto_box = { version = "0.9", default-features = false, features = ["alloc", "salsa20"] }

# The pseudo console of `tests/console.rs` (T-132): the version above, with
# the console's functions, which podssh-ssh builds too; and the job objects of
# `tests/detach_windows.rs` (T-383).
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Security", "Win32_System_Console", "Win32_System_JobObjects",
] }
